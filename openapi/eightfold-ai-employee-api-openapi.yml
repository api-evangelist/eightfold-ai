openapi: 3.2.0
info:
  title: Api_server_v2_service Service Employee API
  version: 1.0.0
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-wu
      - eightfold-ap
tags:
- name: Employee
paths:
  /api/v2/core/employees:
    post:
      description: Creates a new employee
      operationId: create_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Create Employee
      tags:
      - Employee
    get:
      description: List call that returns all the employee profiles.
      operationId: list_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: Any wildcard text to search in position
        in: query
        name: query
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are demandExperiences, temporalFields
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSchema'
          description: OK
      summary: List Employees
      tags:
      - Employee
  /api/v2/core/employees/batch-fetch:
    post:
      description: Batch fetch employees for a given list of profile ids
      operationId: employee_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are demandExperiences, temporalFields
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/EmployeeSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Employees
      tags:
      - Employee
  /api/v2/core/employees/role-match-score:
    get:
      description: List call that returns employees match scores against their current roles.
      operationId: list_employee_role_match_score
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMatchScoreResponseSchema'
          description: OK
      summary: List Employee Match Scores
      tags:
      - Employee
  /api/v2/core/employees/{employeeId}/matched-positions:
    get:
      description: 'Returns the positions recommended to an employee, at parity with the Career Hub ''Recommended jobs'' feed: the tenant''s Career Hub position visibility rules, feed search overrides, the employee''s job preferences and location, and dismissed jobs all apply, and results are sorted by match score. An empty list means the feed has no recommendations for the employee. By default the Career Hub fallback rows ("Showing other relevant jobs") are not returned; pass fallback=true to get them when the primary feed is empty and the tenant''s feed config enables a fallback. Runs as the employee, so the employee must have a user login and Career Hub enabled. For the recruiter-side ATS match of any profile use /profiles//matched-positions instead. JWT callers need Career Hub position access and can only request their own recommendations.'
      operationId: list_employee_matched_positions
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (encoded or decoded), or the employee ID from the HR system. The profile ID is tried first.
        in: path
        name: employeeId
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Defaults to true. Pass false to skip computing validatedSkills and missingSkills, returning them as empty lists.
        in: query
        name: validatedSkills
        schema:
          type: string
      - description: Defaults to false. Pass true to return the Career Hub fallback rows (the tenant feed config's fallback_config, shown on the home page as 'Showing other relevant jobs') when the primary recommended-jobs feed is empty and the tenant config has should_call_fallback enabled. Fallback rows are not personalised matches.
        in: query
        name: fallback
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MatchingPositionsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Matched Positions for Employee
      tags:
      - Employee
  /api/v2/core/employees/{profileId}:
    get:
      description: Given a profile id of a employee, it returns all attributes of the employee
      operationId: get_employee_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (supports both encoded and decoded ID)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are demandExperiences, temporalFields
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSchema'
          description: OK
      summary: Get Employee
      tags:
      - Employee
    patch:
      description: 'Patches employee given its profile_id. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (supports both encoded and decoded)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAsyncSchema'
          description: OK
      summary: Patch Employee
      tags:
      - Employee
    put:
      description: Updates employee given its profile_id.
      operationId: update_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (supports both encoded and decoded)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAsyncSchema'
          description: OK
      summary: Update Employee
      tags:
      - Employee
  /api/v2/core/employees/{profileId}/matched-demands:
    get:
      description: Returns all the matching demands for an employee profile. Only works for employee profiles, not candidates. By default, demands are filtered by the employee's location and a minimum star rating threshold of 3.5. Results are sorted by match score (highest to lowest). Use ignoreLocation=true to search globally and minStarThreshold to adjust the quality threshold.
      operationId: list_employee_matched_demands
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Employee Profile ID (supports both encoded and decoded ID)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Demand Filter Query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: 'When true, applies the same filters used in the Demand Marketplace (Career Hub), including user group access control and configured visibility rules. Default: false'
        in: query
        name: applyMarketplaceFilters
        schema:
          default: false
          type: boolean
      - description: 'When true, applies the same filters used in the Matched Demands widget on the employee profile page in Resource Management. Default: false'
        in: query
        name: applyMatchedDemandsWidgetFilters
        schema:
          default: false
          type: boolean
      - description: 'When true, ignores the profile''s location when matching demands. By default, demands are filtered to match the employee''s location. Default: false'
        in: query
        name: ignoreLocation
        schema:
          default: false
          type: boolean
      - description: 'Minimum star rating threshold (1.0 to 5.0) for matched demands. Only demands with match scores at or above this threshold will be returned. Default: 3.5'
        in: query
        name: minStarThreshold
        schema:
          default: 3.5
          format: float
          maximum: 5
          minimum: 1
          type: number
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MatchingDemandsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Matched Demands for Employee
      tags:
      - Employee
  /api/v2/core/employees/{profileId}/recommended-mentors:
    get:
      description: Given a profile ID of an employee, return recommended mentors
      operationId: list_employee_recommended_mentors
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Eightfold employee profile ID (supports both encoded and decoded)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/RecommendedMentorSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Recommended Mentors
      tags:
      - Employee
  /api/v2/core/hris-systems/{systemId}/ext-employees/{employeeId}:
    patch:
      description: 'Patches employee given its employee id. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_HRIS_employee_ext_employees
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: System ID of profile. Use default if you have only one system and dont want to use system-Id.
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Employee unique Id
        in: path
        name: employeeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAsyncSchema'
          description: OK
      summary: Patch HRIS Employee
      tags:
      - Employee
    put:
      description: Updates employee given its employee id.
      operationId: update_HRIS_employee_ext_employees
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: System ID of profile. Use default if you have only one system and dont want to use system-Id.
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Employee unique Id
        in: path
        name: employeeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeAsyncSchema'
          description: OK
      summary: Update HRIS Employee
      tags:
      - Employee
components:
  schemas:
    CertificateSchema:
      type: object
      properties:
        verificationStatus:
          type:
          - string
          - 'null'
          description: verification status of a certification
        country:
          type:
          - string
          - 'null'
          description: Certificate issued country
        skills:
          type:
          - array
          - 'null'
          description: Skills associated with the certification
          items:
            type: string
        comments:
          type:
          - string
          - 'null'
          description: Comments on the certification
        validFromDate:
          type:
          - string
          - 'null'
          description: Valid From Date
        date:
          type:
          - string
          - 'null'
          description: Certificate issue date
        allText:
          type:
          - array
          - 'null'
          description: All text associated with the certification
          items:
            type: string
        source:
          type:
          - string
          - 'null'
          readOnly: true
          description: source
        startDate:
          type:
          - string
          - 'null'
          description: Start date
        validToDate:
          type:
          - string
          - 'null'
          description: Valid To Date
        certificateId:
          type:
          - string
          - 'null'
          description: License number of a certification
        state:
          type:
          - string
          - 'null'
          description: Certificate issued state
        title:
          type:
          - string
          - 'null'
          description: Title of certificate
        endDate:
          type:
          - string
          - 'null'
          description: End date
        verificationBy:
          type:
          - string
          - 'null'
          description: email of the verifier
        externalKey:
          type:
          - string
          - 'null'
          description: External key
        verificationTs:
          type:
          - integer
          - 'null'
          format: int32
          description: verification timestamp
        status:
          type:
          - string
          - 'null'
          description: Certificate status
        certificateType:
          type:
          - string
          - 'null'
          description: Type of certificate
        proficiency:
          type:
          - string
          - 'null'
          description: proficiency of a certification
        attachmentIds:
          type:
          - array
          - 'null'
          description: List of attachment ids of the certification
          items:
            type: string
        certificateExternalId:
          type:
          - string
          - 'null'
          description: external id for the type of certification
        issuingAuthority:
          type:
          - string
          - 'null'
          description: Certificate issuing authority
        description:
          type:
          - string
          - 'null'
          description: Certificate description
      required:
      - title
    ATSSkillGroup:
      type: object
      properties:
        proficiency:
          type:
          - string
          - 'null'
          description: Proficiency
        skillGroup:
          type:
          - string
          - 'null'
          description: Skill Group
    AtsContent:
      type: object
      properties:
        extension:
          type:
          - string
          - 'null'
          description: extension
        content:
          type:
          - string
          - 'null'
          description: content
        isBase64:
          type:
          - boolean
          - 'null'
          description: is base 64 encoded?
    SkillAssessmentMetadata:
      type: object
      properties:
        last_manager_assessment_by:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: profile ID of the manager submitting the manager assessment
        last_manager_assessment_ts:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: The timestamp of last submission of manager assessment
        last_self_assessment_by:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: profile ID of the employee submitting the self assessment
        last_self_assessment_ts:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: The timestamp of last submission of self assessment
    EmployeePerformanceRating:
      type: object
      properties:
        periodEndDate:
          type:
          - string
          - 'null'
          description: The performance period end date
        rating:
          type:
          - number
          - 'null'
          format: float
          description: The rating given
        reviewedBy:
          description: The reviewer info
          allOf:
          - $ref: '#/components/schemas/User'
        ratingLabel:
          type:
          - string
          - 'null'
          description: The rating level
        reviewComments:
          type:
          - string
          - 'null'
          description: The review comments
        periodStartDate:
          type:
          - string
          - 'null'
          description: The performance period start date
        reviewType:
          type:
          - string
          - 'null'
          description: The review type
    EmployeeAsyncSchema:
      type: object
      properties:
        transactionId:
          type:
          - string
          - 'null'
          readOnly: true
          description: ''
    RoleMatchScoreResponseSchema:
      type: object
      properties:
        employeeId:
          type:
          - string
          - 'null'
          readOnly: true
          description: The unique id of the Employee in the HRIS system
        jobCode:
          type:
          - string
          - 'null'
          readOnly: true
          description: The job code of the employee
        matchScores:
          readOnly: true
          description: Match score details against employee's current role
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmployeeMatchScoreSchema'
        profileId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Encoded employee profile ID in Eightfold Career Hub
    AtsCertificationSchema:
      type: object
      properties:
        locationCountry:
          type:
          - string
          - 'null'
          description: Country where certification was issued
        verificationStatus:
          type:
          - string
          - 'null'
          description: verification status of a certification
        licenseNo:
          type:
          - string
          - 'null'
          description: License number of a certification
        skills:
          type:
          - array
          - 'null'
          description: Skills associated with the certification
          items:
            type: string
        validFromTs:
          type:
          - integer
          - 'null'
          format: int32
          description: validtion from timestamp of a certification
        comments:
          type:
          - string
          - 'null'
          description: Comments on the certification
        allText:
          type:
          - string
          - 'null'
          description: All text associated with the certification
        endTs:
          type:
          - integer
          - 'null'
          format: int32
          description: ending timestamp of a certification
        verificationBy:
          type:
          - string
          - 'null'
          description: email of the verifier
        certificateName:
          type:
          - string
          - 'null'
          description: certificate name of a certification
        verificationTs:
          type:
          - integer
          - 'null'
          format: int32
          description: verification timestamp
        status:
          type:
          - string
          - 'null'
          description: Status of the certification
        certificateType:
          type:
          - string
          - 'null'
          description: Type of the certification
        proficiency:
          type:
          - string
          - 'null'
          description: proficiency of a certification
        validToTs:
          type:
          - integer
          - 'null'
          format: int32
          description: validation till timestamp of a certification
        attachmentIds:
          type:
          - array
          - 'null'
          description: List of attachment ids of a certification
          items:
            type: string
        startTs:
          type:
          - integer
          - 'null'
          format: int32
          description: starting timestamp of a certification
        certificateExternalId:
          type:
          - string
          - 'null'
          description: external id for the type of certification
        locationState:
          type:
          - string
          - 'null'
          description: State where certification was issued
        issuingAuthority:
          type:
          - string
          - 'null'
          description: issuing authority of a certification
        description:
          type:
          - string
          - 'null'
          description: Description of the certification

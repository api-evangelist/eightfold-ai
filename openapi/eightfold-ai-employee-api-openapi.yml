openapi: 3.2.0
info:
  title: Eightfold Ai Employee API
  version: '1.0'
  description: 'Operations tagged Employee across 2 of this provider''s published API definitions: eightfold-ai-api-server-v2-service-service.yml, eightfold-ai-api.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
- url: //api.eightfold.ai
tags:
- name: Employee
paths:
  /api/v2/core/hris-systems/{systemId}/ext-employees/{employeeId}:
    patch:
      description: 'Patches employee given its employee id. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_HRIS_employee_ext_employees
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: System ID of profile. Use default if you have only one system and dont want to use system-Id.
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Employee unique Id
        in: path
        name: employeeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Patch HRIS Employee
      tags:
      - Employee
    put:
      description: Updates employee given its employee id.
      operationId: update_HRIS_employee_ext_employees
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: System ID of profile. Use default if you have only one system and dont want to use system-Id.
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Employee unique Id
        in: path
        name: employeeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Update HRIS Employee
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/core/employees/{profileId}:
    get:
      description: Given a profile id of a employee, it returns all attributes of the employee
      operationId: get_employee_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (supports both encoded and decoded ID)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are demandExperiences, temporalFields
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSchema'
          description: OK
      summary: Get Employee
      tags:
      - Employee
    patch:
      description: 'Patches employee given its profile_id. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (supports both encoded and decoded)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Patch Employee
      tags:
      - Employee
    put:
      description: Updates employee given its profile_id.
      operationId: update_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Eightfold employee profile ID (supports both encoded and decoded)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Update Employee
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/core/employees:
    post:
      description: Creates a new employee
      operationId: create_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Create Employee
      tags:
      - Employee
    get:
      description: List call that returns all the employee profiles.
      operationId: list_employee
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: Any wildcard text to search in position
        in: query
        name: query
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are demandExperiences, temporalFields
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSchema'
          description: OK
      summary: List Employees
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/core/employees/batch-fetch:
    post:
      description: Batch fetch employees for a given list of profile ids
      operationId: employee_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are demandExperiences, temporalFields
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/EmployeeSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Employees
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/core/employees/{profileId}/recommended-mentors:
    get:
      description: Given a profile ID of an employee, return recommended mentors
      operationId: list_employee_recommended_mentors
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Eightfold employee profile ID (supports both encoded and decoded)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/RecommendedMentorSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Recommended Mentors
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/core/employees/role-match-score:
    get:
      description: List call that returns employees match scores against their current roles.
      operationId: list_employee_role_match_score
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMatchScoreResponseSchema'
          description: OK
      summary: List Employee Match Scores
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/core/employees/{profileId}/matched-demands:
    get:
      description: Returns all the matching demands for an employee profile. Only works for employee profiles, not candidates. By default, demands are filtered by the employee's location and a minimum star rating threshold of 3.5. Results are sorted by match score (highest to lowest). Use ignoreLocation=true to search globally and minStarThreshold to adjust the quality threshold.
      operationId: list_employee_matched_demands
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Employee Profile ID (supports both encoded and decoded ID)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Demand Filter Query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: 'When true, applies the same filters used in the Demand Marketplace (Career Hub), including user group access control and configured visibility rules. Default: false'
        in: query
        name: applyMarketplaceFilters
        schema:
          default: false
          type: boolean
      - description: 'When true, applies the same filters used in the Matched Demands widget on the employee profile page in Resource Management. Default: false'
        in: query
        name: applyMatchedDemandsWidgetFilters
        schema:
          default: false
          type: boolean
      - description: 'When true, ignores the profile''s location when matching demands. By default, demands are filtered to match the employee''s location. Default: false'
        in: query
        name: ignoreLocation
        schema:
          default: false
          type: boolean
      - description: 'Minimum star rating threshold (1.0 to 5.0) for matched demands. Only demands with match scores at or above this threshold will be returned. Default: 3.5'
        in: query
        name: minStarThreshold
        schema:
          default: 3.5
          format: float
          maximum: 5
          minimum: 1
          type: number
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MatchingDemandsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Matched Demands for Employee
      tags:
      - Employee
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /v1/employee/{email_id}:
    parameters:
    - name: email_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee'
      summary: Get Employee by Email
      description: Given email it returns the candidate id and other attributes
      operationId: get_employee_by_email
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Employee
    servers:
    - url: //api.eightfold.ai
  /v1/employee/{employee_email}/get_matched_jobs:
    parameters:
    - name: employee_email
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/matchJob'
      summary: Get Matching Jobs by Email
      description: Given email it returns the matching jobs
      operationId: get_matching_jobs_by_email
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 5
          - 10
      - name: start
        in: query
        description: starting index of the job to be fetched
        schema:
          type: integer
          default: 0
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Employee
    servers:
    - url: //api.eightfold.ai
components:
  schemas:
    Publication:
      type: object
      properties:
        date:
          type:
          - string
          - 'null'
          description: Patent date
        skills:
          type:
          - array
          - 'null'
          description: Publication skills
          items:
            type: string
        publisher:
          type:
          - string
          - 'null'
          description: Patent publisher
        description:
          type: string
          description: Patent description
        title:
          type:
          - string
          - 'null'
          description: Patent title
      required:
      - description
    EmployeeSuccessor:
      type: object
      properties:
        employeeDetails:
          description: The employee details
          allOf:
          - $ref: '#/components/schemas/User'
        readiness:
          type:
          - string
          - 'null'
          description: The readiness of the successor
        rank:
          type:
          - integer
          - 'null'
          format: int32
          description: The rank
        comments:
          type:
          - string
          - 'null'
          description: The comments
    AtsApplicationSchema:
      type: object
      properties:
        locationCountry:
          type:
          - string
          - 'null'
          description: location country of an application
        reason:
          type:
          - string
          - 'null'
          maxLength: 5000
          description: reason for an application
        location:
          type:
          - string
          - 'null'
          description: location of an application
        visaStatuses:
          type:
          - array
          - 'null'
          description: list of visa status
          items:
            type: string
        veteranStatusStr:
          type:
          - string
          - 'null'
          readOnly: true
          description: String value for veteran status of the applicant
        jobs:
          description: Jobs related to an application.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Jobs'
        hiredTs:
          type:
          - integer
          - 'null'
          format: int32
          description: hired timestamp of an applicant
        lastModifiedTs:
          type:
          - integer
          - 'null'
          format: int32
          description: last modified timestamp of an application
        customInfo:
          type:
          - object
          - 'null'
          description: custom info for an application
        note:
          description: ats notes for an application
          allOf:
          - $ref: '#/components/schemas/AtsNoteSchema'
        systemId:
          type:
          - string
          - 'null'
          description: system id of an application
        creditor:
          type:
          - string
          - 'null'
          description: creditor of an application
        candidateId:
          type:
          - string
          - 'null'
          description: candidate id of an applicant
        rejectedTs:
          type:
          - integer
          - 'null'
          format: int32
          description: rejected timestamp of an applicant
        veteranStatus:
          type:
          - boolean
          - 'null'
          description: Boolean value for veteran status of the applicant
        applicationTs:
          type:
          - integer
          - 'null'
          format: int32
          description: application timestamp
        pastStages:
          description: past stages of an application
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsStage'
        sourceName:
          type:
          - string
          - 'null'
          description: source name of an application
        isProspect:
          type:
          - boolean
          - 'null'
          description: is prospective applicant
        scorecards:
          description: scorecards for an application
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsScorecard'
        jobSystemId:
          type:
          - string
          - 'null'
          description: job system id for an application
        disabilityStatus:
          type:
          - boolean
          - 'null'
          description: disability status of an applicant
        currentStage:
          description: current stage of an application
          allOf:
          - $ref: '#/components/schemas/AtsStage'
        status:
          type:
          - string
          - 'null'
          description: 'Status of application.Valid inputs: active, hired, rejected, converted, withdrawn'
        races:
          type:
          - array
          - 'null'
          description: list of races of an applicant
          items:
            type: string
        sourceType:
          type:
          - string
          - 'null'
          description: source type of an application
        gender:
          type:
          - string
          - 'null'
          description: gender of an applicant
        questions:
          description: questions
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsQuestionAnswer'
        rejectedBy:
          type:
          - string
          - 'null'
          description: applicant rejected by
        disabilityStatusStr:
          type:
          - string
          - 'null'
          readOnly: true
          description: disability status of an applicant
        applicationId:
          type: string
          description: application id
      required:
      - applicationId
      - applicationTs
      - candidateId
      - lastModifiedTs
    CandidateEducation:
      type: object
      properties:
        verificationStatus:
          type:
          - string
          - 'null'
          description: verification status of the education details
        location:
          type:
          - string
          - 'null'
          description: Location of Candidate Education
        school:
          type:
          - string
          - 'null'
          description: School of candidate
        isCurrent:
          type:
          - boolean
          - 'null'
          description: Currently working in an organization
        isGraduated:
          type:
          - boolean
          - 'null'
          description: graduation status of the candidate
        endTime:
          type:
          - integer
          - 'null'
          format: int32
          description: end time of candidate
        awards:
          type:
          - array
          - 'null'
          description: Awards of candidate
          items:
            type: string
        source:
          type:
          - string
          - 'null'
          readOnly: true
          description: source
        degree:
          type:
          - string
          - 'null'
          description: Degree of candidate
        startTime:
          type:
          - integer
          - 'null'
          format: int32
          description: start time of candidate
        verificationBy:
          type:
          - string
          - 'null'
          description: email of the verifier
        major:
          type:
          - string
          - 'null'
          description: major of candidate
        majorExternalId:
          type:

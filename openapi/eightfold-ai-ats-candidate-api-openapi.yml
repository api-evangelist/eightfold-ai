openapi: 3.2.0
info:
  title: Api_server_v2_service Service ATS Candidate API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: ATS Candidate
paths:
  /api/v2/core/ats-systems/{systemId}/ats-candidates/{atsCandidateId}:
    get:
      description: Given an ats candidate id of a candidate, it returns the ats candidate object
      operationId: get_ats_candidate_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of candidate
        in: path
        name: atsCandidateId
        required: true
        schema:
          type: string
      - description: ATS system id of candidate
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are applications, tags, notes
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSProfileSchema'
          description: OK
      summary: Get ATS Candidate
      tags:
      - ATS Candidate
    put:
      description: 'To update the existing ats candidate, include the ats_candidate_id in the params. Please Note: Update will overwrite existing fields. If empty fields are sent during an update, those fields will be wiped out'
      operationId: update_ats_candidate
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of profile
        in: path
        name: atsCandidateId
        required: true
        schema:
          type: string
      - description: System ID of profile
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Set to 'true' if updates need to be processed for this profile despite it being claimed. Defaults to false
        in: query
        name: refreshClaimedProfile
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSProfileSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Update ATS Candidate
      tags:
      - ATS Candidate
    patch:
      description: 'Given an ats candidate id and data that needs to be patched, it patches the ats candidate. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_ats_candidate
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of candidate
        in: path
        name: atsCandidateId
        required: true
        schema:
          type: string
      - description: System ID of profile
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Set to 'true' if updates need to be processed for this profile despite it being claimed. Defaults to false
        in: query
        name: refreshClaimedProfile
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSProfileSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Patch ATS Candidate
      tags:
      - ATS Candidate
  /api/v2/core/ats-systems/{systemId}/ats-candidates:
    get:
      description: Search ats candidates using query parameters and get the complete ats candidate objects
      operationId: list_ats_candidate
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: any wildcard text to search in position
        in: query
        name: query
        schema:
          type: string
      - description: System ID of profile
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ATSProfileSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List ATS Candidates
      tags:
      - ATS Candidate
    post:
      description: To add a new ats candidate in the system, send the candidate information in the payload. ats candidate id will be sent back in case of a successful response
      operationId: create_ats_candidate
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: System ID of profile
        in: path
        name: systemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateATSProfileSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Create ATS Candidate
      tags:
      - ATS Candidate

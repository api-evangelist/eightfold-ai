openapi: 3.2.0
info:
  title: Api_server_v2_service Service Upskill Plan Template API
  version: 1.0.0
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-wu
      - eightfold-ap
tags:
- name: Upskill Plan Template
paths:
  /api/v2/careerhub/upskill-plan-templates:
    get:
      description: List upskilling plan templates, most recently updated first. API-key callers get every template in the tenant; signed-in callers get the templates they own. Advance `start` by `limit` to read the next page.
      operationId: list_upskill_plan_template
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpskillingPlanTemplateSchema'
          description: OK
      summary: List Upskill Plan Templates
      tags:
      - Upskill Plan Template
    post:
      description: Create an upskilling plan template from an external system. Published unless status says otherwise. 409 with the existing planId if externalId already exists in the tenant. `sections` is optional. When it is omitted, the plan is created with one empty section.
      operationId: create_upskill_plan_template
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpskillingPlanTemplateCreateSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpskillingPlanTemplateSchema'
          description: OK
      summary: Create Upskill Plan Template
      tags:
      - Upskill Plan Template
  /api/v2/careerhub/upskill-plan-templates/ext/{externalId}:
    get:
      description: Fetch an upskilling plan template by the caller's externalId.
      operationId: get_upskill_plan_template_ext_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: The caller's own id for the template, unique per tenant
        in: path
        name: externalId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpskillingPlanTemplateSchema'
          description: OK
      summary: Get Upskill Plan Template by External Id
      tags:
      - Upskill Plan Template
    patch:
      description: 'Update the template of the tenant that has the externalId. Fields in the body replace the stored ones; absent fields are left unchanged. `sections` is optional. When it is omitted, the plan''s sections are unchanged. When it is sent, it replaces all of the plan''s sections: afterwards the plan has exactly the sections, courses and tasks in the body. Send `[]` to remove every section.'
      operationId: patch_upskill_plan_template_ext
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: The caller's own id for the template, unique per tenant
        in: path
        name: externalId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpskillingPlanTemplatePatchSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpskillingPlanTemplateSchema'
          description: OK
      summary: Update Upskill Plan Template by External Id
      tags:
      - Upskill Plan Template
    delete:
      description: Delete an upskilling plan template by the caller's externalId.
      operationId: delete_upskill_plan_template_ext
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: The caller's own id for the template, unique per tenant
        in: path
        name: externalId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Upskill Plan Template by External Id
      tags:
      - Upskill Plan Template
  /api/v2/careerhub/upskill-plan-templates/{planId}:
    get:
      description: Fetch an upskilling plan template by planId.
      operationId: get_upskill_plan_template_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: 'Plan id: `id` from the GET or list response'
        in: path
        name: planId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpskillingPlanTemplateSchema'
          description: OK
      summary: Get Upskill Plan Template
      tags:
      - Upskill Plan Template
    patch:
      description: 'Update an upskilling plan template. Fields in the body replace the stored ones; absent fields are left unchanged. `sections` is optional. When it is omitted, the plan''s sections are unchanged. When it is sent, it replaces all of the plan''s sections: afterwards the plan has exactly the sections, courses and tasks in the body. Send `[]` to remove every section.'
      operationId: patch_upskill_plan_template
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: 'Plan id: `id` from the GET or list response'
        in: path
        name: planId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpskillingPlanTemplatePatchSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpskillingPlanTemplateSchema'
          description: OK
      summary: Update Upskill Plan Template
      tags:
      - Upskill Plan Template
    delete:
      description: Delete an upskilling plan template. Plans already assigned from it are kept.
      operationId: delete_upskill_plan_template
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: 'Plan id: `id` from the GET or list response'
        in: path
        name: planId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Upskill Plan Template
      tags:
      - Upskill Plan Template
components:
  schemas:
    UpskillingPlanTemplateSchema:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
          readOnly: true
          description: 'Template status: draft | published'
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Template plan id
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Created timestamp (epoch seconds)
        planSubtype:
          type:
          - string
          - 'null'
          readOnly: true
          description: Plan subtype
        sections:
          readOnly: true
          description: Ordered sections with their entities; progress is not set on templates
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UpskillingPlanSectionSchema'
        name:
          type:
          - string
          - 'null'
          readOnly: true
          description: Plan title
        externalId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Your external record id, unique in the tenant. Addresses the plan in the /ext/<externalId> paths.
        userId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Plan creator user id
        planDurationDays:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Plan duration in days
        publishedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Publish timestamp (epoch seconds)
        skills:
          type:
          - array
          - 'null'
          readOnly: true
          description: Skill names
          items:
            type: string
        groupId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Tenant group id
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Updated timestamp (epoch seconds)
        description:
          type:
          - string
          - 'null'
          readOnly: true
          description: Plan description
        associatedRoleIds:
          type:
          - array
          - 'null'
          readOnly: true
          description: Role ids, as returned by GET /api/v2/JIE/roles
          items:
            type: string
    UpskillingPlanSectionSchema:
      type: object
      properties:
        sectionName:
          type:
          - string
          - 'null'
          description: Section heading
        entities:
          description: Ordered entities in this section
          type: array
          items:
            $ref: '#/components/schemas/UpskillingPlanEntitySchema'
      required:
      - entities
      - sectionName
    UpskillingPlanTemplateCreateSchema:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
          description: 'Template status: draft | published. Defaults to published.'
        externalId:
          type:
          - string
          - 'null'
          description: Your external record id, unique in the tenant. Addresses the plan in the /ext/<externalId> paths.
        planSubtype:
          type:
          - string
          - 'null'
          description: Plan subtype, one of the subtypes configured for your account. Defaults to general.
        sections:
          description: '`sections` is optional. When it is omitted, the plan is created with one empty section.'
          type: array
          items:
            $ref: '#/components/schemas/UpskillingPlanSectionSchema'
        name:
          type:
          - string
          - 'null'
          description: Plan title
        planDurationDays:
          type:
          - integer
          - 'null'
          format: int32
          description: Plan duration in days. Rounded down to whole weeks, at most 693; values under 7 leave it unset.
        creatorProfileId:
          type:
          - string
          - 'null'
          description: 'Encoded profile id of the plan creator, from GET /api/v2/core/employees. Must be a user who can sign in; the creator can edit the plan. Required for API-key callers. A signed-in caller is the creator: omit it, or send your own id.'
        skills:
          type: array
          description: Skill names the plan develops. A task's skills must come from this list.
          items:
            type: string
        description:
          type:
          - string
          - 'null'
          description: Plan description
        associatedRoleIds:
          type: array
          description: Role ids, as returned by GET /api/v2/JIE/roles.
          items:
            type: string
      required:
      - name
    UpskillingPlanEntitySchema:
      type: object
      properties:
        entityType:
          type:
          - string
          - 'null'
          description: 'Entity type: task | course'
        progress:
          type:
          - string
          - 'null'
          description: 'Entity progress: not_started | in_progress | completed. Assigned plans only; rejected on templates.'
        courseId:
          type:
          - string
          - 'null'
          description: EF course id, as returned in courseId by GET /api/v2/core/courses. Required for course, omit for task.
        skills:
          type: array
          description: Skill names the task covers. Each must be one of the plan's skills, matched ignoring case. Omit for course.
          items:
            type: string
        description:
          type:
          - string
          - 'null'
          description: Task description. Omit for course.
        title:
          type:
          - string
          - 'null'
          description: Task title. Required for task, omit for course. Identifies the task across updates.
      required:
      - entityType
    UpskillingPlanTemplatePatchSchema:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
          description: 'Template status: draft | published'
        planSubtype:
          type:
          - string
          - 'null'
          description: Plan subtype, one of the subtypes configured for your account. Defaults to general.
        sections:
          description: '`sections` is optional. When it is omitted, the plan''s sections are unchanged. When it is sent, it replaces all of the plan''s sections: afterwards the plan has exactly the sections, courses and tasks in the body. Send `[]` to remove every section.'
          type: array
          items:
            $ref: '#/components/schemas/UpskillingPlanSectionSchema'
        name:
          type:
          - string
          - 'null'
          description: Plan title
        planDurationDays:
          type:
          - integer
          - 'null'
          format: int32
          description: Plan duration in days. Rounded down to whole weeks, at most 693; values under 7 leave it unset.
        skills:
          type: array
          description: Skill names the plan develops. A task's skills must come from this list.
          items:
            type: string
        description:
          type:
          - string
          - 'null'
          description: Plan description
        associatedRoleIds:
          type: array
          description: Role ids, as returned by GET /api/v2/JIE/roles.
          items:
            type: string
      required:
      - name

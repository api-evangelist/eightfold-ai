openapi: 3.2.0
info:
  title: Api_server_v2_service Service Offer API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: Offer
paths:
  /api/v2/ats/offers/{offerId}:
    get:
      description: Given an Offer id, it returns all attributes of the Offer
      operationId: get_offer_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of an offer in Eightfold
        in: path
        name: offerId
        required: true
        schema:
          type: string
      - description: version of the offer
        in: query
        name: version
        schema:
          type: string
      - description: Comma-separated list of macro variable IDs to evaluate and include in the response customInfo.
        in: query
        name: macroIds
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSchema'
          description: OK
      summary: Get Offer
      tags:
      - Offer
    patch:
      description: 'Patches an offer given its id. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_offer
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of an offer in Eightfold
        in: path
        name: offerId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSchema'
          description: OK
      summary: Patch Offer
      tags:
      - Offer
    delete:
      description: Delete (soft-delete) a DRAFT offer that has not progressed beyond creation. Returns a success confirmation.
      operationId: delete_offer
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of an offer in Eightfold
        in: path
        name: offerId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete Offer
      tags:
      - Offer
  /api/v2/ats/offers/ats-systems/{systemId}/ats-candidates/{atsCandidateId}/ats-positions/{atsPositionId}:
    patch:
      description: 'Upserts an offer identified by ATS IDs (system + ats candidate id + ats position id). If an offer already exists for the resolved (candidate, position) it is patched in place; otherwise a new offer is created and linked to the candidate''s latest application. PATCH semantics: idempotent; only fields present in the body are applied; absent fields are not touched.'
      operationId: patch_offer_ats_positions
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS system id (e.g. 'successfactors')
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: ATS-side candidate id (e.g. SF candidateId)
        in: path
        name: atsCandidateId
        required: true
        schema:
          type: string
      - description: ATS-side position / job requisition id (e.g. SF jobReqId)
        in: path
        name: atsPositionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateOfferSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdateOfferSchema'
          description: OK
      summary: Patch Offer by ATS IDs
      tags:
      - Offer
  /api/v2/ats/offers:
    get:
      description: Search offers using query parameters and get the complete offer objects
      operationId: list_offer
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: any wildcard text to search in offer
        in: query
        name: query
        schema:
          type: string
      - description: Whether to include attachments signed urls in the response
        in: query
        name: includeAttachments
        schema:
          type: boolean
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSchema'
          description: OK
      summary: List Offers
      tags:
      - Offer
    post:
      description: Create a prefilled DRAFT offer for a candidate on a position. positionId and profileId are required; applicationId is optional -- when omitted, the candidate's latest application to the position is linked. The candidate must already have an application to the position; if they have none the request is rejected (advance the candidate into the position's pipeline first via the application-stages API). Field values are set in a separate PATCH /offers/ call (two-step create, mirroring the UI create -> intake-form flow). Returns the full created offer. If an offer already exists for the candidate+position, that existing offer is returned.
      operationId: create_offer
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Whether to prefill candidate, position and compensation data on the new offer. Defaults to true.
        in: query
        name: prefill
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreateSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSchema'
          description: OK
      summary: Create Offer
      tags:
      - Offer

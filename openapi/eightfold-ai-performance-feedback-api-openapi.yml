          readOnly: true
          description: Timestamp when this event was created
        isCancelled:
          type:
          - boolean
          - 'null'
          description: ''
        eventSpeakers:
          type:
          - array
          - 'null'
          readOnly: true
          description: List of speakers
          items:
            type: string
        activeRegistrations:
          type:
          - string
          - 'null'
          readOnly: true
          description: active registrations
        registerButton:
          readOnly: true
          description: Registration button information
          allOf:
          - $ref: '#/components/schemas/RegisterButton'
        eventTeamDataJson:
          type:
          - object
          - 'null'
          readOnly: true
          description: Event team data
        eventBucket:
          type:
          - string
          - 'null'
          description: Bucket of the event
        address:
          type:
          - string
          - 'null'
          description: Address of venue
        eventCustomFieldsJson:
          type:
          - object
          - 'null'
          readOnly: true
          description: Event custom fields
        eventType:
          type:
          - string
          - 'null'
          description: ''
        institution:
          type:
          - string
          - 'null'
          description: Institution related to event
        selectedTimezone:
          type:
          - string
          - 'null'

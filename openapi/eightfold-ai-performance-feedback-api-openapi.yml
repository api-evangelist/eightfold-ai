openapi: 3.2.0
info:
  title: Api_server_v2_service Service Performance Feedback API
  version: 1.0.0
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-wu
      - eightfold-ap
tags:
- name: Performance Feedback
paths:
  /api/v2/careerhub/performance-feedback:
    get:
      description: List performance feedbacks. At least one of `profileEncId`, `reviewerEmail`, `requesterEmail` is required so the result set is always scoped. Backed by `PerformanceReviewService.search_performance_reviews`.
      operationId: list_careerhub_performance_feedback
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Encoded profile id of the candidate the feedback is about (one of profileEncId / reviewerEmail / requesterEmail is required)
        in: query
        name: profileEncId
        schema:
          type: string
      - description: Filter on reviewer email (one of profileEncId / reviewerEmail / requesterEmail is required)
        in: query
        name: reviewerEmail
        schema:
          type: string
      - description: Filter on requester email (one of profileEncId / reviewerEmail / requesterEmail is required)
        in: query
        name: requesterEmail
        schema:
          type: string
      - description: Filter on status of the feedback
        in: query
        name: status
        schema:
          type: string
      - description: When true, return only pending feedbacks
        in: query
        name: pendingOnly
        schema:
          type: boolean
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceFeedbackSchema'
          description: OK
      summary: List Performance Feedbacks
      tags:
      - Performance Feedback
  /api/v2/careerhub/performance-feedback/provide:
    post:
      description: 'Submit performance feedback (''Give Feedback''). Body: `{templateId, answers, profileEncId?, reviewRequestId?}`. `profileEncId` is required unless this is a self-submitted review.'
      operationId: create_careerhub_provide
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceFeedbackProvideSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceFeedbackSchema'
          description: OK
      summary: Provide Performance Feedback
      tags:
      - Performance Feedback
  /api/v2/careerhub/performance-feedback/request:
    post:
      description: 'Request performance feedback for a candidate from one or more reviewers (''Request Feedback''). Body: `{profileEncId, requesteeEmails, templateId, deadline?, contextPrompt?, onBehalfOf?}`.'
      operationId: create_careerhub_request
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceFeedbackRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceFeedbackSchema'
          description: OK
      summary: Request Performance Feedback
      tags:
      - Performance Feedback
  /api/v2/careerhub/performance-feedback/{reviewId}:
    get:
      description: Fetch a performance feedback by `reviewId`.
      operationId: get_careerhub_performance_feedback_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Performance review id
        in: path
        name: reviewId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceFeedbackSchema'
          description: OK
      summary: Get Performance Feedback
      tags:
      - Performance Feedback
components:
  schemas:
    ProfileFeedbackQuestionAnswer:
      type: object
      properties:
        answer:
          type:
          - string
          - 'null'
          readOnly: true
          description: Answer
        label:
          type:
          - string
          - 'null'
          readOnly: true
          description: Label
        questionId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Question ID
        comment:
          type:
          - string
          - 'null'
          readOnly: true
          description: Comment
    ApplicationMatchScore:
      type: object
      properties:
        topMatches:
          type:
          - array
          - 'null'
          description: The top few items driving this score (e.g. the matched skills or title terms), up to 3
          items:
            type: string
        indeterminable:
          type:
          - integer
          - 'null'
          format: int32
          description: 1 when there wasn't enough data to compute this score (score will be -1), otherwise 0
        score:
          type:
          - integer
          - 'null'
          format: int32
          description: Match strength for this aspect on a 0-5 scale (higher is a better match); -1 when it could not be determined
        relevantScoreTypeVal:
          type:
          - integer
          - 'null'
          format: int32
          description: 'A supporting count eg: matching skills (skill) or relevant years of experience (experience). Null when not applicable'
        scoreRaw:
          type:
          - number
          - 'null'
          format: float
          description: The underlying un-rounded score behind the 0-5 rating (e.g. raw overall stars); may be null when not applicable
        scoreType:
          type:
          - string
          - 'null'
          description: Which aspect of the match this score describes eg- overall fit, skill, title, or experience
    AtsOpenings:
      type: object
      properties:
        closedAt:
          type:
          - integer
          - 'null'
          format: int32
          description: Closing timestamp in epoch format
        openingDetails:
          description: Details of the openings
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsOpeningDetail'
        numOpenings:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of openings. Set to -1 for unlimited openings
        openedAt:
          type:
          - integer
          - 'null'
          format: int32
          description: Opening timestamp in epoch format
        numOpeningsFilled:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of openings filled
    ATSPositionData:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          description: creation timestamp in epoch format
        locationCountry:
          type:
          - string
          - 'null'
          description: Country of the location
        coordinators:
          description: all the coordinators related to this position
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Person'
        businessUnit:
          type:
          - string
          - 'null'
          description: business unit
        isPrivate:
          type:
          - boolean
          - 'null'
          description: Indicates if a position is a private posting
        workLocationOption:
          type:
          - string
          - 'null'
          description: Indicates the option for working location e.g. onsite, remote_global, remote_local, hybrid
        atsEntityId:
          type:
          - string
          - 'null'
          description: position_id in the ats system
        hiringManager:
          description: Hiring Manager
          allOf:
          - $ref: '#/components/schemas/Person'
        internalPostingUrl:
          type:
          - string
          - 'null'
          description: internal posting url
        evergreen:
          type:
          - boolean
          - 'null'
          description: is evergreen
        skills:
          type:
          - array
          - 'null'
          description: skills
          items:
            type: string
        company:
          type:
          - string
          - 'null'
          description: company
        locationCity:
          type:
          - string
          - 'null'
          description: City of the location
        lastUpdated:
          type:
          - integer
          - 'null'
          format: int32
          description: last modified date time in epoch format
        displayJobId:
          type:
          - string
          - 'null'
          description: display job id
        openings:
          description: Openings
          allOf:
          - $ref: '#/components/schemas/AtsOpenings'
        hiringTeam:
          readOnly: true
          description: 'Unified hiring team array. Each entry: {role, roleKey, name, email}. Includes primary/secondary HMs, primary/secondary recruiters, and custom roles.'
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HiringTeamMember'
        followers:
          description: all the followers of the positions as hiring managers etc.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Person'
        startDate:
          type:
          - string
          - 'null'
          description: start date of the position in ISO 8601 format (e.g. 2024-05-01)
        requisitionType:
          type:
          - string
          - 'null'
          description: Requisition Type
        systemId:
          type:
          - string
          - 'null'
          description: system id
        activities:
          description: all the activities related to this positions
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PositionActivities'
        postedFor:
          type:
          - string
          - 'null'
          description: 'internal for internal jobs, external for external jobs, or all for both. Can be omitted for unposted positions.Input values must be one of these: internal, external, all, None'
        questionnaires:
          description: questionnaires
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Questionnaire'
        restrictAccess:
          type:
          - boolean
          - 'null'
          description: restrict access
        title:
          type:
          - string
          - 'null'
          description: job title
        templateId:
          type:
          - integer
          - 'null'
          format: int32
          description: Template id of the template used to create the position
        recruiter:
          description: recruiter
          allOf:
          - $ref: '#/components/schemas/Person'
        jobPosts:
          description: job postings
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JobPost'
        hiringBand:
          type:
          - string
          - 'null'
          description: hiring band
        postingTitle:
          type:
          - string
          - 'null'
          description: posting title
        employmentType:
          type:
          - string
          - 'null'
          description: Employment Type
        posted:
          type:
          - boolean
          - 'null'
          description: status of the position posted or not
        locationFlexibility:
          type:
          - string
          - 'null'
          description: Indicates the flexibility on location e.g. not_flexible, flexible_within_country, flexible_global
        orgUnits:
          type:
          - object
          - 'null'
          description: Org units of the position
        companyDescription:
          type:
          - string
          - 'null'
          description: Company description
        customFields:
          type:
          - object
          - 'null'
          description: custom fields
        sourcers:
          description: all the recruiters/sourcers related to this positions
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Person'
        workflowTemplateId:
          type:
          - string
          - 'null'
          description: Indicates which workflow this position belongs to
        status:
          type:
          - string
          - 'null'
          description: status
        jobCode:
          type:
          - string
          - 'null'
          description: ATS attribute which identifies the job this jobrequestion is mapped to
        open:
          type:
          - boolean
          - 'null'
          description: Whether the requisition is open for hiring per the source ATS - derived from its status or open headcount at ingestion, and updated on close/fill/reopen. Distinct from the top-level open field, which only reports that the record is not archived or deleted.
        postingUrl:
          type:
          - string
          - 'null'
          description: posting url
        atsUserGroups:
          description: ATS user groups
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsUserGroups'
        createdBy:
          type:
          - string
          - 'null'
          description: Email of the user who created this position
        function:
          type:
          - string
          - 'null'
          description: job function
        jobStages:
          type:
          - array
          - 'null'
          description: job_stages
          items:
            type: string
        requiredSkills:
          type:
          - array
          - 'null'
          description: required skills
          items:
            type: string
        questions:
          description: questions
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Questions'
        locationState:
          type:
          - string
          - 'null'
          description: State of the location
        locations:
          type:
          - array
          - 'null'
          description: location
          items:
            type: string
        positionId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: EF Position ID
        description:
          type:
          - string
          - 'null'
          description: job description
      required:
      - atsEntityId
      - company
      - createdAt
      - lastUpdated
      - open
      - posted
      - recruiter
      - status
      - title
    HiringTeamMember:
      type: object
      properties:
        role:
          type:
          - string
          - 'null'
          description: Role label (e.g. Hiring Manager, HRBP)
        email:
          type:
          - string
          - 'null'
          description: Email of the team member
        name:
          type:
          - string
          - 'null'
          description: Name of the team member
        roleKey:
          type:
          - string
          - 'null'
          description: Storage key for the role (e.g. hiring_manager, secondary_hiring_managers, cust_hrbp)
    QuestionLabel:
      type: object
      properties:
        langMappingList:
          description: lang_mapping_list
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LangMapping'
        label:
          type:
          - string
          - 'null'
          description: label
        value:
          type:
          - string
          - 'null'
          description: value
    PerformanceFeedbackSchema:
      type: object
      properties:
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: Datetime when this feedback was created
        plannedEventId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Planned event id for candidate source
        feedbackResponse:
          readOnly: true
          description: Received feedback's details
          allOf:
          - $ref: '#/components/schemas/ProfileFeedbackResponse'
        followUpEnabled:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Denotes if the feedback follow up is enabled or not
        profileId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Profile ID associated with the profile feedback
        communityId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Community Id for candidate source
        sharedFeedbackMessageId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Message Id for shared feedback
        viewFeedbackUrl:
          type:
          - string
          - 'null'
          readOnly: true
          description: URL to view feedback
        requestedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Timestamp when the feedback was requested
        reminderCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Number of reminders sent
        requester:
          readOnly: true
          description: Requester of the ProfileFeedback
          allOf:
          - $ref: '#/components/schemas/UserLogin'
        submittedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Timestamp when the feedback was first submitted
        reviewerEmail:
          type:
          - string
          - 'null'
          readOnly: true
          description: Email of reviewer of the ProfileFeedback
        feedbackType:
          type:
          - string
          - 'null'
          readOnly: true
          description: type of the feedback
        feedbackTemplateId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Feedback template ID
        feedbackEncId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Encoded ID of the ProfileFeedback
        requesterEmail:
          type:
          - string
          - 'null'
          readOnly: true
          description: Email of requester of the ProfileFeedback
        archiveFlag:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Denotes if the feedback is archived or not
        position:
          readOnly: true
          description: Position for which feedback was given
          allOf:
          - $ref: '#/components/schemas/PositionSchema'
        userCalendarEventId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: User calendar event id
        feedbackId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ID of the ProfileFeedback
        feedbackTemplateName:
          type:
          - string
          - 'null'
          readOnly: true
          description: Feedback template name
        reviewer:
          readOnly: true
          description: Reviewer of the ProfileFeedback
          allOf:
          - $ref: '#/components/schemas/UserLogin'
        plannedEvent:
          readOnly: true
          description: Planned event for candidate source
          allOf:
          - $ref: '#/components/schemas/PlannedEvent'
        matchingData:
          readOnly: true
          description: Application matching information
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApplicationMatchScore'
        status:
          type:
          - string
          - 'null'
          readOnly: true
          description: status of the feedback
        feedbackJson:
          type:
          - object
          - 'null'
          readOnly: true
          description: Feedback JSON
        feedbackUrl:
          type:
          - string
          - 'null'
          readOnly: true
          description: URL to provide feedback
        positionId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Position ID for which feedback was given
    QuestionDependencies:
      type: object
      properties:
        questionId:
          type:
          - string
          - 'null'
          description: question id
        questionSource:
          type:
          - string
          - 'null'
          description: question source
        choiceValue:

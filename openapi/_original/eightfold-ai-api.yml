openapi: 3.0.0
paths:
  /v1/candidate:
    post:
      responses:
        '200':
          description: Success
      summary: Post Candidate
      description: 'Post the complete candidate object without the profileId param to add a new candidate.

        On the other hand, to update the existing candidate in the System, include the profileId in the
        params.

        Please Note: Update will overwrite existing fields. If empty fields are sent during an update,

        those fields will be wiped out.'
      operationId: post_candidate_post
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/candidate_add_request'
        required: true
      tags:
      - Candidate
  /v1/candidate/advance-application:
    post:
      responses:
        '200':
          description: Success
      summary: Advance Application Stage
      description: Advance the stage of a candidate's application for a given job id
      operationId: post_advance_application_stage
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/candidate_advance_application'
        required: true
      tags:
      - Candidate
  /v1/candidate/dummy-error: {}
  /v1/candidate/search:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/candidateProfile'
      summary: Search Candidate
      description: Search a candidate using query parameters and get the complete candidate object
      operationId: get_candidate_search
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: atsEntityId
        in: query
        description: unique identifier in the ATS system
        schema:
          type: string
      - name: firstName
        in: query
        description: first name of the candidate
        schema:
          type: string
      - name: lastName
        in: query
        description: last name of the candidate
        schema:
          type: string
      - name: email
        in: query
        description: email of the candidate
        schema:
          type: string
      - name: title
        in: query
        description: title or designation of the candidate
        schema:
          type: string
      - name: work
        in: query
        description: organization or company of the candidate
        schema:
          type: string
      - name: stage
        in: query
        description: stage of the candidate
        schema:
          type: string
      - name: location
        in: query
        description: location of the candidate
        schema:
          type: string
      - name: source
        in: query
        description: source of the candidate
        schema:
          type: string
      - name: hasTags
        in: query
        description: gets the candidates who has the tags as ("Screened" "Rejected")
        schema:
          type: string
      - name: lastModified
        in: query
        description: last updated date range of the candidate as [1598375838 TO *]
        schema:
          type: string
      - name: filterQuery
        in: query
        description: filter query using predefined filter arguments documented at https://apidocs.eightfold.ai/docs#the-filterquery-parameter
        schema:
          type: string
      - name: query
        in: query
        description: any wildcard text to search in candidate data
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 10
          - 50
          - 100
      - name: start
        in: query
        description: starting index of the candidate to be fetched
        schema:
          type: integer
          default: 0
      - name: include
        in: query
        description: if you want additional fields in the response, please specify comma separate values
          as resume,tags,applications,notes
        schema:
          type: string
          default: resume,tags,applications
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Candidate
  /v1/candidate/talent-pool:
    post:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/candidate_join_talent_pool'
      summary: 'Join Talent Pool: Allowing the candidate to join talent pool'
      operationId: post_join_talent_pool
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  description: Candidate first name
                  type: string
                lastName:
                  description: Candidate last name
                  type: string
                email:
                  description: Candidate email
                  type: string
                phone:
                  description: Candidate phone number
                  type: string
                urls:
                  description: Candidate LinkedIn, stackoverflow urls
                  type: array
                  items:
                    type: string
                title:
                  description: Candidate title in the last company
                  type: string
                company:
                  description: Candidate last company
                  type: string
                location:
                  description: Candidate current location
                  type: string
                customTag:
                  description: Candidate tags that can be attached
                  type: array
                  items:
                    type: string
                resume:
                  description: Candidate resume
                  type: string
                  format: binary
                emailSubscription:
                  description: Candidate email subscription
                  type: boolean
              required:
              - firstName
              - lastName
              - email
        required: true
      tags:
      - Candidate
  /v1/candidate/{profile_id}:
    parameters:
    - name: profile_id
      in: path
      required: true
      schema:
        type: string
    delete:
      responses:
        '200':
          description: Success
      summary: Delete Candidate
      description: 'Given a profile id of a candidate it marks the candidate deleted in eightfold.

        it might take few minutes to reflect to all products, as it is asynchronous action.'
      operationId: delete_candidate_by_id
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      tags:
      - Candidate
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/candidateProfile'
      summary: Get Candidate
      description: Given a profile id of a candidate it returns the all other attributes of the candidate
      operationId: get_candidate_by_id
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: include
        in: query
        description: if you want additional fields in the response, please specify comma separate values
          as resume,tags,applications
        schema:
          type: string
          default: resume,tags,applications
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Candidate
  /v1/candidate/{profile_id}/matched-jobs:
    parameters:
    - name: profile_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/matchJob'
      summary: Get Matching Jobs
      description: Given profile id of a candidate it returns the matching jobs for the given the candidate
      operationId: get_matched_jobs_for_candidate
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 5
          - 10
      - name: start
        in: query
        description: starting index of the job to be fetched
        schema:
          type: integer
          default: 0
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Candidate
  /v1/employee/{email_id}:
    parameters:
    - name: email_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/employee'
      summary: Get Employee by Email
      description: Given email it returns the candidate id and other attributes
      operationId: get_employee_by_email
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Employee
  /v1/employee/{employee_email}/get_matched_jobs:
    parameters:
    - name: employee_email
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/matchJob'
      summary: Get Matching Jobs by Email
      description: Given email it returns the matching jobs
      operationId: get_matching_jobs_by_email
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 5
          - 10
      - name: start
        in: query
        description: starting index of the job to be fetched
        schema:
          type: integer
          default: 0
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Employee
  /v1/events/open/list:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/planned_event_list_with_branding'
      summary: Get Open Events
      description: Get list of all happening/upcoming published open events
      operationId: get_planned_event_search
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Events
  /v1/insights/candidates:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entityInsights'
      summary: Insights for Candidates
      description: Retrieve insights (field distributions) for candidates given a query
      operationId: get_candidate_insights
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: query
        in: query
        description: any wildcard text to search in candidate data
        schema:
          type: string
      - name: filterQuery
        in: query
        description: filter query using predefined filter arguments documented at https://apidocs.eightfold.ai/docs#the-filterquery-parameter
        schema:
          type: string
      - name: fields
        in: query
        description: comma separated list of fields to get distributions for
        schema:
          type: string
      - name: limit
        in: query
        description: number of unique values per field to get counts
        schema:
          type: string
      - name: positionMatchedFor
        in: query
        description: Eightfold position ID for candidates to match
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Insights
  /v1/insights/talent-traits:
    post:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/talentTraits'
      summary: Get Talent Trait Analytics
      description: 'Post a query with different filters for talent traits. All the values in the same
        filter is treated as a

        or operation, while all the values in a different filter is treated as a and operation.'
      operationId: post_talent_traits
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/talentTraitsFilter'
        required: true
      tags:
      - Insights
  /v1/oauthusers/calendar:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthUserInfo'
      operationId: get_calendar
      parameters:
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - OAuthUsers
  /v1/position:
    post:
      responses:
        '200':
          description: Success
      summary: Post Job
      description: Post the complete Job object to add a new Job Position or update the existing job in
        the System
      operationId: post_position_post
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/position_post_request'
        required: true
      tags:
      - Position
  /v1/position/search:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/matched_jobs'
      summary: Search Position
      description: Search a Job Position using query parameters and get the complete Position details
      operationId: get_position_search
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: atsEntityId
        in: query
        description: unique identifier in the ATS system
        schema:
          type: string
      - name: query
        in: query
        description: any wildcard text to search in position
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 5
          - 10
      - name: start
        in: query
        description: starting index of the job to be fetched
        schema:
          type: integer
          default: 0
      - name: filterQuery
        in: query
        description: filter query using predefined filter arguments documented at https://apidocs.eightfold.ai/docs#the-filterquery-parameter
        schema:
          type: string
      - name: include
        in: query
        description: if you want additional fields in the response, please specify comma separate values
          as calibration, atsdata
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Position
  /v1/position/{job_position_id}/applicants:
    parameters:
    - name: job_position_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/candidateProfile'
      summary: Get Applicants
      description: Given a job id it returns the applicants for this job
      operationId: get_applicants
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 10
          - 50
      - name: start
        in: query
        description: starting index of the page to be fetched
        schema:
          type: integer
          default: 0
      - name: include
        in: query
        description: if you want additional fields in the response, please specify comma separate values
          as tags,applications,notes,resume
        schema:
          type: string
          default: tags,applications,notes
      - name: filterQuery
        in: query
        description: filter query using predefined filter arguments documented at https://apidocs.eightfold.ai/docs#the-filterquery-parameter
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Position
  /v1/position/{job_position_id}/matched-candidates:
    parameters:
    - name: job_position_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/matched_candidate'
      summary: Get Matching Candidates
      description: Given a job id it returns the matching candidates for this job
      operationId: get_matched_candidates
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: filterQuery
        in: query
        description: filter query using predefined filter arguments documented at https://apidocs.eightfold.ai/docs#the-filterquery-parameter
        schema:
          type: string
      - name: limit
        in: query
        description: max number of results to be fetched
        explode: true
        schema:
          type: integer
          enum:
          - 5
          - 10
      - name: start
        in: query
        description: starting index of the page to be fetched
        schema:
          type: integer
          default: 0
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Position
  /v1/position/{position_id}:
    parameters:
    - name: position_id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/position'
      summary: Get Position
      description: Given a job id it returns other attributes of this job
      operationId: get_position_by_id
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: include
        in: query
        description: if you want additional fields in the response, please specify comma separate values
          as calibration, atsdata
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Position
info:
  title: API
  version: '1.0'
  x-source-url: https://dash.readme.com/api/v1/api-registry/eb0jwp1fol38uq2p9
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
tags:
- name: Candidate
  description: services related to candidate id
- name: Employee
  description: services related to employee
- name: Events
  description: services related to events
- name: Insights
  description: services related to talent insights
- name: Position
  description: services related to position id
- name: OAuthUsers
  description: serves info on the oauth usage of users
servers:
- url: //api.eightfold.ai
components:
  responses:
    ParseError:
      description: When a mask can't be parsed
    MaskError:
      description: When any error occurs on mask
  schemas:
    candidateProfile:
      required:
      - title
      properties:
        industries:
          type: array
          items:
            type: string
        title:
          type: string
          description: The job designation of the candidate
        skills:
          type: array
          items:
            type: string
        highlights:
          type: array
          items:
            type: string
        summary:
          type: string
        experience:
          type: array
          items:
            $ref: '#/components/schemas/candidateExperience'
        email:
          type: string
        phone:
          type: string
        awards:
          type: array
          items:
            type: string
        location:
          type: string
        urls:
          type: array
          items:
            type: string
        gender:
          type: string
        race:
          type: string
        imageUrl:
          type: string
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        education:
          type: array
          items:
            $ref: '#/components/schemas/candidateEducation'
        resume:
          type: string
          description: base 64 encoded string representing resume of the candidate
        resumeFileName:
          type: string
          description: File name including extension such as txt, docx, pdf
        id:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/candidateTag'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/candidateNote'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/candidateApplication'
        customFields:
          type: object
          description: custom fields key-value pairs, key is the field name
        atsEntityId:
          type: string
        lastUpdated:
          type: integer
          description: Epoch timestamp of the last activity.
      type: object
    candidateExperience:
      properties:
        description:
          type: string
        title:
          type: string
        skills:
          type: array
          items:
            type: string
        work:
          type: string
        location:
          type: string
        startTime:
          type: integer
        endTime:
          type: integer
        duration:
          type: integer
        isCurrent:
          type: boolean
        isInternal:
          type: boolean
      type: object
    candidateEducation:
      properties:
        school:
          type: string
        description:
          type: string
        degree:
          type: string
        major:
          type: string
        awards:
          type: array
          items:
            type: string
        startTime:
          type: integer
        endTime:
          type: integer
        imageUrl:
          type: string
        eduLevel:
          type: string
      type: object
    candidateTag:
      properties:
        tag:
          type: string
        type:
          type: string
        createdTime:
          type: integer
        creatorEmail:
          type: string
      type: object
    candidateNote:
      properties:
        note:
          type: string
        noteType:
          type: string
        positionId:
          type: string
        createdTime:
          type: integer
        creatorEmail:
          type: string
      type: object
    candidateApplication:
      properties:
        sourceName:
          type: string
        applicationId:
          type: string
        candidateId:
          type: string
        visaStatus:
          type: string
        sourceType:
          type: string
        applicationTime:
          type: integer
        positionId:
          type: string
        positionTitle:
          type: string
        lastModifiedTime:
          type: integer
        currentStage:
          type: string
        applicationStatus:
          type: string
        applicationAnswers:
          type: array
          items:
            $ref: '#/components/schemas/applicationQuestionAnswers'
        atsJobId:
          type: string
        reason:
          type: string
        matchScore:
          type: number
      type: object
    applicationQuestionAnswers:
      required:
      - question
      - questionId
      properties:
        questionId:
          type: string
        question:
          type: string
        answer:
          type: string
      type: object
    candidate_add_request:
      required:
      - atsEntityId
      - company
      - firstName
      - lastUpdated
      - profileId
      - title
      properties:
        firstName:
          type: string
          description: First name of the candidate
        profileId:
          type: string
          description: Eightfold profile id of the candidate to look up for updating.
        atsEntityId:
          type: string
          description: ATS Entity id of the candidate. Use to add a new profile to Eightfold or to look
            up and update an existing profile.
        lastUpdated:
          type: integer
          description: Epoch timestamp of the last activity for the candidate
        title:
          type: string
          description: Current title of the candidate
        company:
          type: string
          description: Current company of the candidate
        emails:
          type: array
          items:
            type: string
            description: Emails of the candidate
        urls:
          type: array
          items:
            type: string
            description: Professional URLs for the candidate
        lastName:
          type: string
          description: Last name of the candidate

      description: 'Search courses using query parameters and get the complete course object. recommendedFor
        feature does not support query addition. Note: It may take some time for the newly deleted courses
        to disappear from LIST call, as there may be indexing delays. You can still use the GET BY ID
        call right after deletion of course to confirm the deletion of the course.'

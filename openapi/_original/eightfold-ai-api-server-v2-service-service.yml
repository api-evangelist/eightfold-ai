servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
paths:
  /oauth/v1/clients: {}
  /oauth/v1/authenticate: {}
  /oauth/v1/tokens/validate: {}
  /api/v2/core/ats-systems/{systemId}/ats-positions/{atsPositionId}:
    get:
      description: Given an ats position id, it returns all attributes of the ats position
      operationId: get_ats_position_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of position
        in: path
        name: atsPositionId
        required: true
        schema:
          type: string
      - description: System ID of position
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top
          level fields present in corresponding API schema. To check API schema, expand the response section
          below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList
          is empty, all fields will be returned. Possible values are the names of the top level fields
          present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSPositionDataSchema'
          description: OK
      summary: Get ATS Position
      tags:
      - ATS Position
    put:
      description: 'To update the existing Ats Position in the System, include the ats position id in
        the params. Please Note: Update will overwrite existing fields. If empty fields are sent during
        an update, those fields will be wiped out'
      operationId: update_ats_position
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of position
        in: path
        name: atsPositionId
        required: true
        schema:
          type: string
      - description: System ID of position
        in: path
        name: systemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSPositionDataSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSPositionDataSchema'
          description: OK
      summary: Update ATS Position
      tags:
      - ATS Position
    patch:
      description: 'Given an ats position id and data that needs to be patched, it patches the ats position.
        Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_ats_position
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of position
        in: path
        name: atsPositionId
        required: true
        schema:
          type: string
      - description: System ID of position
        in: path
        name: systemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSPositionDataSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSPositionDataSchema'
          description: OK
      summary: Patch ATS Position
      tags:
      - ATS Position
  /api/v2/core/ats-systems/{systemId}/ats-positions:
    get:
      description: Search ats positions using query parameters and get the complete ats position objects
      operationId: list_ats_position
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: any wildcard text to search in position
        in: query
        name: query
        schema:
          type: string
      - description: System ID of position
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top
          level fields present in corresponding API schema. To check API schema, expand the response section
          below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList
          is empty, all fields will be returned. Possible values are the names of the top level fields
          present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ATSPositionDataSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List ATS Positions
      tags:
      - ATS Position
    post:
      description: To add a new ats position in the system, send the position information in the payload.
        ats position id will be sent back in case of a successful response
      operationId: create_ats_position
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: System ID of position
        in: path
        name: systemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ATSPositionDataSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSPositionDataSchema'
          description: OK
      summary: Create ATS Position
      tags:
      - ATS Position
  /api/v2/core/ats-systems/{systemId}/ats-positions/{atsPositionId}/attachments:
    post:
      description: 'Upload attachments for an ATS Position. Each file can be provided either as a URL
        or base64 encoded content.


        Restrictions:

        - Maximum 10MB per file and total upload

        - Allowed file types: PDF, DOCX, XLSX, JPG, PNG, TXT

        - URLs must be publicly accessible HTTPS endpoints

        - Private IPs and localhost URLs are blocked for security

        - All files must succeed or entire operation fails (transactional)'
      operationId: create_ats_position_attachments
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS entity ID of position
        in: path
        name: atsPositionId
        required: true
        schema:
          type: string
      - description: System ID of position
        in: path
        name: systemId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionAttachmentUploadRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionAttachmentUploadResponseSchema'
          description: Successfully uploaded all attachments. Returns list of uploaded attachment details
            including attachment_id, name, type, size, and optional client-provided key.
      summary: Upload ATS Position Attachments
      tags:
      - ATS Position
  /api/v2/core/profiles/{profileId}/matched-positions:
    get:
      description: Returns all the matching positions for a profile
      operationId: list_position_matched
      parameters:
      - description: The secret key to access the api. It starts with the bearer token

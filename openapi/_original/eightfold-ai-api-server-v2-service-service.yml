        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Position Filter Query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: Profile Id
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top
          level fields present in corresponding API schema. To check API schema, expand the response section
          below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList
          is empty, all fields will be returned. Possible values are the names of the top level fields
          present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MatchingPositionsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Matched Positions for Profile
      tags:
      - Profile
      - Position
  /api/v2/core/positions/{positionId}:
    get:
      description: Given a position id, it returns all attributes of the position

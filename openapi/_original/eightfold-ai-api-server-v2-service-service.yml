        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSchema'
          description: OK
      summary: List Offers
      tags:
      - Offer
    post:
      description: Create a prefilled DRAFT offer for a candidate on a position. positionId and profileId
        are required; applicationId is optional -- when omitted, the candidate's latest application to
        the position is linked. The candidate must already have an application to the position; if they
        have none the request is rejected (advance the candidate into the position's pipeline first via
        the application-stages API). Field values are set in a separate PATCH /offers/ call (two-step
        create, mirroring the UI create -> intake-form flow). Returns the full created offer. If an offer
        already exists for the candidate+position, that existing offer is returned.
      operationId: create_offer
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Whether to prefill candidate, position and compensation data on the new offer. Defaults
          to true.
        in: query
        name: prefill
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreateSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSchema'
          description: OK
      summary: Create Offer
      tags:
      - Offer

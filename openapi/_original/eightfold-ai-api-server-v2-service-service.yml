    patch:
      description: 'Upserts an offer identified by ATS IDs (system + ats candidate id + ats position id).
        If an offer already exists for the resolved (candidate, position) it is patched in place; otherwise
        a new offer is created and linked to the candidate''s latest application. PATCH semantics: idempotent;
        only fields present in the body are applied; absent fields are not touched.'
      operationId: patch_offer_ats_positions
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ATS system id (e.g. 'successfactors')
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: ATS-side candidate id (e.g. SF candidateId)
        in: path
        name: atsCandidateId
        required: true
        schema:
          type: string
      - description: ATS-side position / job requisition id (e.g. SF jobReqId)
        in: path
        name: atsPositionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateOfferSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdateOfferSchema'
          description: OK
      summary: Patch Offer by ATS IDs
      tags:
      - Offer
  /api/v2/ats/offers:
    get:
      description: Search offers using query parameters and get the complete offer objects
      operationId: list_offer
      parameters:

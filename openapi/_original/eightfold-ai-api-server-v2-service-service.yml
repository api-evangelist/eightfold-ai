  /api/v2/core/positions/apply-form-questions/{positionId}:
    get:
      description: Returns the apply-form questions for a position, resolved for the requested apply context
        (userMode)
      operationId: get_position_apply_form_questions_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of position in Eightfold
        in: path
        name: positionId
        required: true
        schema:
          type: string
      - description: 'Apply context to resolve questions for. One of: ''employee'' (internal/IJP form),
          ''logged_out_candidate'' (external form), or ''logged_in_candidate'' (external form for an authenticated
          candidate).'
        in: query
        name: userMode
        required: true
        schema:
          enum:
          - employee
          - logged_out_candidate
          - logged_in_candidate
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top
          level fields present in corresponding API schema. To check API schema, expand the response section
          below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList
          is empty, all fields will be returned. Possible values are the names of the top level fields
          present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyFormQuestionsSchema'
          description: OK
      summary: Get Position Apply Form Questions
      tags:
      - Position

        city:
          type: string
          readOnly: true
          nullable: true
          description: City
        street:
          type: string
          readOnly: true
          nullable: true
          description: Street / house number
        state:
          type: string
          readOnly: true
          nullable: true
          description: State / region
    ProfileLastContact:

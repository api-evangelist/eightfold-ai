  /api/v2/core/employees/{profileId}/matched-demands:
    get:
      description: Returns all the matching demands for an employee profile. Only works for employee profiles,
        not candidates. By default, demands are filtered by the employee's location and a minimum star
        rating threshold of 3.5. Results are sorted by match score (highest to lowest). Use ignoreLocation=true
        to search globally and minStarThreshold to adjust the quality threshold.
      operationId: list_employee_matched_demands
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Employee Profile ID (supports both encoded and decoded ID)
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Demand Filter Query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: 'When true, applies the same filters used in the Demand Marketplace (Career Hub),
          including user group access control and configured visibility rules. Default: false'
        in: query
        name: applyMarketplaceFilters
        schema:
          default: false
          type: boolean
      - description: 'When true, applies the same filters used in the Matched Demands widget on the employee
          profile page in Resource Management. Default: false'
        in: query
        name: applyMatchedDemandsWidgetFilters
        schema:
          default: false
          type: boolean
      - description: 'When true, ignores the profile''s location when matching demands. By default, demands
          are filtered to match the employee''s location. Default: false'
        in: query
        name: ignoreLocation
        schema:
          default: false
          type: boolean
      - description: 'Minimum star rating threshold (1.0 to 5.0) for matched demands. Only demands with
          match scores at or above this threshold will be returned. Default: 3.5'
        in: query
        name: minStarThreshold
        schema:
          default: 3.5
          format: float
          maximum: 5
          minimum: 1
          type: number
      - description: Exclude specific fields in the response. Possible values are the names of the top
          level fields present in corresponding API schema. To check API schema, expand the response section
          below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList
          is empty, all fields will be returned. Possible values are the names of the top level fields
          present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MatchingDemandsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Matched Demands for Employee
      tags:
      - Employee
      - Demand

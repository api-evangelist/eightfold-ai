        awards:
          type: array
          nullable: true
          description: Awards of candidate
          items:
            type: string
        source:
          type: string
          readOnly: true
          nullable: true
          description: source
        degree:
          type: string
          nullable: true
          description: Degree of candidate
        startTime:
          type: integer
          format: int32
          nullable: true
          description: start time of candidate
        verificationBy:
          type: string
          nullable: true

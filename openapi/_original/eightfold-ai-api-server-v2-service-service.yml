      tags:
      - Position
    patch:
      description: 'Given a position id and data that needs to be patched, it patches the position. Note:
        All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_position
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: EF Entity ID of position
        in: path
        name: positionId
        required: true

openapi: 3.2.0
info:
  title: Api_server_v2_service Service Profile Application API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: Profile Application
paths:
  /api/v2/core/profile-applications/{profileApplicationId}:
    get:
      description: Given a profile application id, it returns all attributes of the profile application
      operationId: get_profile_application_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: profile application id of application in Eightfold
        in: path
        name: profileApplicationId
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are customInfo
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileApplicationSchema'
          description: OK
      summary: Get Profile Application
      tags:
      - Profile Application
  /api/v2/core/profile-applications/batch-fetch:
    post:
      description: Batch fetch profile applications for a given list of applications ids (limit 100)
      operationId: profile_application_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are customInfo
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ProfileApplicationSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Profile Applications
      tags:
      - Profile Application
  /api/v2/core/profile-applications:
    get:
      description: Search profile applications using specific filter parameters and get all attributes of profile applications
      operationId: list_profile_application
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Limit on the total number of search results, defaults to 100
        in: query
        name: queryLimit
        schema:
          type: string
      - description: Filter on application id
        in: query
        name: applicationId
        schema:
          type: string
      - description: Filter on profile id of the candidate. Accepts the numeric or encoded profile id.
        in: query
        name: profileId
        schema:
          type: string
      - description: Filter on position id associated with the application
        in: query
        name: positionId
        schema:
          type: string
      - description: Filter on ats job id
        in: query
        name: atsJobId
        schema:
          type: string
      - description: Filter on status of the application
        in: query
        name: applicationStatus
        schema:
          type: string
      - description: Filter on application stage
        in: query
        name: stage
        schema:
          type: string
      - description: Comma-separated list of application ids to fetch. Can be combined with the other filters to narrow within the set.
        in: query
        name: entityIds
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are customInfo
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ProfileApplicationSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Profile Applications
      tags:
      - Profile Application

openapi: 3.2.0
info:
  title: Api_server_v2_service Service Profile API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: Profile
paths:
  /api/v2/core/profiles/{profileId}/matched-positions:
    get:
      description: Returns all the matching positions for a profile
      operationId: list_position_matched
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Position Filter Query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: Profile Id
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/MatchingPositionsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Matched Positions for Profile
      tags:
      - Profile
  /api/v2/core/profiles/{profileId}/attachments/{attachmentId}:
    get:
      description: Given the key for an attachment, it fetches the attachment in octet-stream format
      operationId: get_profile_attachments_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Attachment Id
        in: path
        name: attachmentId
        required: true
        schema:
          type: string
      - description: Profile Id
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
      summary: Get Attachment
      tags:
      - Profile
  /api/v2/core/profiles/{profileId}:
    get:
      description: Given a profile id of a candidate, it returns all attributes of the profile
      operationId: get_profile_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of candidate in Eightfold
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are resume, applications, tags, notes, attachmentsInfo, inferredSkills, careerSiteQuestions, deletedAt, demandExperiences, jtnSubmissions, lastContact
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileSchema'
          description: OK
      summary: Get Profile
      tags:
      - Profile
    put:
      description: 'To update the existing Profile(Candidate/Employee) in the System, include the profileId in the params. Please Note: Update will overwrite existing fields. If empty fields are sent during an update, those fields will be wiped out'
      operationId: update_profile
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: EF Entity ID of candidate
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Set to 'true' if updates need to be processed for this profile despite it being claimed. Defaults to false
        in: query
        name: refreshClaimedProfile
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalProfileSchema'
        description: 'Please Note: Adding profileId and title in mandatory.'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Update Profile
      tags:
      - Profile
    delete:
      description: Deletes a specific profile given a profile id
      operationId: delete_profile
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of profile in Eightfold
        in: path
        name: profileId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Delete Profile
      tags:
      - Profile
    patch:
      description: 'Given profile id and data that needs to be patched, it patches the profile. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_profile
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: EF Entity ID of profile
        in: path
        name: profileId
        required: true
        schema:
          type: string
      - description: Set to 'true' if updates need to be processed for this profile despite it being claimed. Defaults to false
        in: query
        name: refreshClaimedProfile
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalProfileSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Patch Profile
      tags:
      - Profile
  /api/v2/core/profiles:
    get:
      description: Search profiles using query parameters and get the complete profile objects
      operationId: list_profile
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Unique identifier in the ATS system
        in: query
        name: atsCandidateId
        schema:
          type: string
      - description: Comma separated list of profile ids (numeric or encoded)
        in: query
        name: profileIds
        schema:
          type: string
      - description: Filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: Any wildcard text to search in position
        in: query
        name: query
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are resume, applications, tags, notes, attachmentsInfo, inferredSkills, careerSiteQuestions, deletedAt, demandExperiences, jtnSubmissions, lastContact
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ExternalProfileSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Profiles
      tags:
      - Profile
    post:
      description: This API creates a profile with the given data in the payload
      operationId: create_profile
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalProfileSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAsyncSchema'
          description: OK
      summary: Create Profile
      tags:
      - Profile
  /api/v2/core/profiles/{profileId}/application/stages:
    post:
      description: Create or advance application stage for a given profile and position
      operationId: create_profile_stages
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Profile ID of profile whose application has to be created or stage advanced
        in: path
        name: profileId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrAdvanceApplicationStageSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageSchema'
          description: OK
      summary: Upsert Application Stage
      tags:
      - Profile
  /api/v2/core/profiles/{profileId}/application/stages/cancel-scheduled-rejection:
    post:
      description: Cancel a scheduled stage rejection for a given profile and application
      operationId: create_profile_cancel_scheduled_rejection
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Profile ID whose scheduled rejection is being cancelled
        in: path
        name: profileId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelScheduledRejectionSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageSchema'
          description: OK
      summary: Cancel Scheduled Stage Rejection
      tags:
      - Profile
  /api/v2/core/profiles/batch-fetch:
    post:
      description: Batch fetch profiles for a given list of profile ids (limit 100)
      operationId: profile_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are resume, applications, tags, notes, attachmentsInfo, inferredSkills, careerSiteQuestions, deletedAt, demandExperiences, jtnSubmissions, lastContact
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/ExternalProfileSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Profiles
      tags:
      - Profile
components:
  schemas:
    AtsUser:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
          description: user id
        email:
          type:
          - string
          - 'null'
          description: email of user
        name:
          type:
          - string
          - 'null'
          description: name of user
        atsRoles:
          type:
          - array
          - 'null'
          description: list of ats roles
          items:
            type: string
    InferredSkillsSchema:
      type: object
      properties:
        skillType:
          type:
          - string
          - 'null'
          readOnly: true
          description: The type of the skills, validated skills or likely skills
        skills:
          type:
          - array
          - 'null'
          readOnly: true
          description: The list of skills
          items:
            type: string
    AtsOpenings:
      type: object
      properties:
        closedAt:
          type:
          - integer
          - 'null'
          format: int32
          description: Closing timestamp in epoch format
        openingDetails:
          description: Details of the openings
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AtsOpeningDetail'
        numOpenings:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of openings. Set to -1 for unlimited openings
        openedAt:
          type:
          - integer
          - 'null'
          format: int32
          description: Opening timestamp in epoch format
        numOpeningsFilled:
          type:
          - integer
          - 'null'
          format: int32
          description: Number of openings filled
    Note:
      type: object
      properties:
        creatorEmail:
          type:
          - string
          - 'null'
          description: creator email of candidate
        id:
          type:
          - string
          - 'null'
          readOnly: true
          description: Note id of candidate
        noteType:
          type:
          - string
          - 'null'
          description: Note type of candidate
        note:
          type:
          - string
          - 'null'
          description: Note of candidate
        profileId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Profile id of candidate
        positionId:
          type:
          - string
          - 'null'
          description: Position id associated with the note
        createdTime:
          type:
          - integer
          - 'null'
          format: int32
          description: created time of candidate in datetime format
    ProfileSuccessionPlanMetric:
      type: object
      properties:
        readiness:
          type:
          - object
          - 'null'
          readOnly: true
          description: readiness of succession plan
    ATSSkillDetail:
      type: object
      properties:
        skillGroups:
          description: Skill groups
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ATSSkillGroup'
        proficiency:
          type:
          - string
          - 'null'
          description: 'Proficiency. Note: proficiency must be specified only for each skill group when skill groups are present'
        evaluationTimestamp:
          type:
          - integer
          - 'null'
          format: int32
          description: Evaluation timestamp
        dataSource:
          type:
          - string
          - 'null'
          description: Data source of the skill
        skill:
          type:
          - string
          - 'null'
          description: Skill
    SkillProficiency:
      type: object
      properties:
        proficiency:
          type:
          - number
          - 'null'
          format: float
          description: proficiency of the role
        skillGroupList:
          description: skill group list of a role
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SkillGroupList'
        level:
          type:
          - string
          - 'null'
          readOnly: true
          description: level of the role
        name:
          type:
          - string
          - 'null'
          description: name of the role
    ProfileReviewer:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          readOnly: true
          description: Email of the user who reviewed the profile
        profileId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Profile Id of the user who reviewed the profile
    ATSScoreCardAttribute:
      type: object
      properties:
        rating:
          type:
          - string
          - 'null'
          description: 'Rating. Valid inputs: strong_yes, yes, mixed, no, strong_no'
        answer:
          type:
          - string
          - 'null'
          description: Answer
        note:
          type:
          - string
          - 'null'
          description: Note
        question:
          type:
          - string
          - 'null'
          description: Question
        rating_label:
          type:
          - string
          - 'null'
          description: Rating label
    RegisterButton:
      type: object
      properties:
        textColor:
          type:
          - string
          - 'null'
          readOnly: true
          description: text color for registration button
        backgroundColor:
          type:
          - string
          - 'null'
          readOnly: true
          description: background color of registration button
        text:
          type:
          - string
          - 'null'
          readOnly: true
          description: Text of registration button
    Jobs:
      type: object
      properties:
        atsJobId:
          type:
          - string
          - 'null'
          description: ATS Job id
        name:
          type:
          - string
          - 'null'
          description: Name
    ProfileStagedSections:
      type: object
      properties:
        education:
          type:
          - object
          - 'null'
          readOnly: true
          description: Education of candidate
        awards:
          type:
          - object
          - 'null'
          readOnly: true
          description: Awards of candidate
        certificates:
          type:
          - object
          - 'null'
          readOnly: true
          description: Certificates
        publications:
          type:
          - object
          - 'null'
          readOnly: true
          description: publications of candidate
        languageProficiencies:
          type:
          - object
          - 'null'
          readOnly: true
          description: language proficiences for employee
        endorsements:
          type:
          - object
          - 'null'
          readOnly: true
          description: endorsements of candidate
        experiences:
          type:
          - object
          - 'null'
          readOnly: true
          description: List of candidate's past experiences
        courses:
          type:
          - object
          - 'null'
          readOnly: true
          description: course attendance of employee
        skills:
          type:
          - object
          - 'null'
          readOnly: true
          description: List of candidate's skills
        patents:
          type:
          - object
          - 'null'
          readOnly: true
          description: patents of candidate
        projects:
          type:
          - object
          - 'null'
          readOnly: true
          description: projects of candidate
    Patent:
      type: object
      properties:
        date:
          type: string
          description: Patent date
        allText:
          type:
          - string
          - 'null'
          description: Patent title
        skills:
          type:
          - array
          - 'null'
          description: Patent skills
          items:
            type: string
        description:
          type:
          - string
          - 'null'
          description: Patent description
        title:
          type: string
          description: Patent title
      required:
      - date
      - title
    QuestionDependencies:
      type: object
      properties:
        questionId:
          type:
          - string
          - 'null'
          description: question id
        questionSource:
          type:
          - string
          - 'null'
          description: question source
        choiceValue:
          type:
          - string
          - 'null'
          description: choice value
        dependencyType:
          type:
          - string
          - 'null'
          description: dependency type
        childQuestionIds:
          type:
          - array
          - 'null'
          description: child question ids
          items:
            type: string
      required:
      - choiceValue
      - questionId
    ProfileSuccessors:
      type: object
      properties:
        successorProfileId:
          type:
          - string
          - 'null'
          readOnly: true
          description: profile id of the successor
        successorReadiness:
          type:
          - string
          - 'null'
          readOnly: true
          description: readiness state of the successor
    ApplicationQuestionAnswers:
      type: object
      properties:
        answer:
          type:
          - string
          - 'null'
          description: Answer of candidate Application question answers
        questionId:
          type:
          - string
          - 'null'
          description: question ID of candidate Application question answers
        question:
          type:
          - string
          - 'null'
          description: question of candidate Application question answers
      required:
      - question
      - questionId
    Questions:
      type: object
      properties:
        choices:
          description: Question choices
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QuestionChoice'
        choicesV2:
          description: Question choices V2. It supports language mapping.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QuestionLabel'
        questionId:
          type:
          - string
          - 'null'
          description: question_id
        help:
          type:
          - string
          - 'null'
          description: help
        type:
          type:
          - string
          - 'null'
          description: type of the question. e.g.-choice, numeric or text
        question:
          description: question. It supports language mapping.
          allOf:
          - $ref: '#/components/schemas/QuestionLabel'
        required:
          type:
          - boolean
          - 'null'
          description: required
      required:
      - questionId
    MatchingPositionsSchema:
      type: object
      properties:
        missingSkills:
          type:
          - array
          - 'null'
          readOnly: true
          description: Position skills missing in candidate's profile
          items:
            type: string
        position:
          readOnly: true
          description: Position information in concise format
          allOf:
          - $ref: '#/components/schemas/ConcisePositionSchema'
        skillScoreRelevance:
          type:
          - number
          - 'null'
          format: float
          readOnly: true
          description: Skill relevance score based on matching of job and candidate profile
        validatedSkills:
          type:
          - array
          - 'null'
          readOnly: true
          description: Position skills validated in candidate's profile
          items:
            type: string
        finalScore:
          type:
          - number
          - 'null'
          format: float
          readOnly: true
          description: The matching score (range 0 to 5) of job and candidate profile
        titleScoreRelevance:
          type:
          - number
          - 'null'
          format: float
          readOnly: true
          description: Title relevance score based on matching of job and candidate profile
    ATSSkillGroup:
      type: object
      properties:
        proficiency:
          type:
          - string
          - 'null'
          description: Proficiency
        skillGroup:
          type:
          - string
          - 'null'
          description: Skill Group
    CareerSiteQuestionsSchema:
      type: object
      properties:
        timestamp:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Timestamp when questions were answered
        positionIdList:
          type:
          - array
          - 'null'
          readOnly: true
          description: List of position ids questions are answers for
          items:
            type: string
        mode:
          type:
          - string
          - 'null'
          readOnly: true
          description: Mode of the questions
        questions:
          type:

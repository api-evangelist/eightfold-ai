openapi: 3.2.0
info:
  title: Eightfold Ai Events API
  version: '1.0'
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: eightfold-ai-api-server-v2-service-service.yml, eightfold-ai-api.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
- url: //api.eightfold.ai
tags:
- name: Events
paths:
  /api/v2/events/planned-events:
    get:
      description: A get call for listing planned events data
      operationId: list_events_planned_events
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedEventsSchema'
          description: OK
      summary: List Planned Events
      tags:
      - Events
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/events/planned-events/batch-fetch:
    post:
      description: Batch fetch planned events for a given list of planned event ids (limit 100)
      operationId: events_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/PlannedEventSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Planned Events
      tags:
      - Events
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /api/v2/events/planned-events/{plannedEventId}:
    get:
      description: Given a planned event id, it returns all attributes of the planned event
      operationId: get_events_planned_events_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: planned event ID of planned event in Eightfold
        in: path
        name: plannedEventId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedEventSchema'
          description: OK
      summary: Get Planned Event
      tags:
      - Events
    servers:
    - url: https://apiv2.{domain}.ai
      variables:
        domain:
          default: eightfold
          enum:
          - eightfold
          - eightfold-eu
          - eightfold-gov
          - eightfold-ca
          - eightfold-me
          - eightfold-wu
          - eightfold-ap
  /v1/events/open/list:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/planned_event_list_with_branding'
      summary: Get Open Events
      description: Get list of all happening/upcoming published open events
      operationId: get_planned_event_search
      parameters:
      - name: Authorization
        in: header
        required: true
        description: The secret key to access the api, starts with Basic
        schema:
          type: string
      - name: X-Fields
        in: header
        description: An optional fields mask
        schema:
          type: string
          format: mask
      tags:
      - Events
    servers:
    - url: //api.eightfold.ai

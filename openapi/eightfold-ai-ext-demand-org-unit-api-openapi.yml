openapi: 3.2.0
info:
  title: Api_server_v2_service Service Ext Demand Org Unit API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: Ext Demand Org Unit
paths:
  /api/v2/resource_management/ext-systems/resourcing/ext-demand-org-units:
    post:
      description: Create a new External Demand Org Unit
      operationId: create_external_demand_org_unit_ext_demand_org_units
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtDemandOrgUnitSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtDemandOrgUnitSchema'
          description: OK
      summary: Create External Demand Org Unit
      tags:
      - Ext Demand Org Unit
  /api/v2/resource_management/ext-systems/resourcing/ext-demand-org-units/{extOrgUnitId}:
    get:
      description: Get an external demand org unit by its id
      operationId: get_external_demand_org_unit_ext_demand_org_units_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: External Demand Org Unit ID
        in: path
        name: extOrgUnitId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtDemandOrgUnitSchema'
          description: OK
      summary: Get External Demand Org Unit
      tags:
      - Ext Demand Org Unit
    patch:
      description: 'Patches an external demand org unit given its id. Note: All required body params in the schema are not enforced in PATCH request, unlike path params.'
      operationId: patch_external_demand_org_unit_ext_demand_org_units
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: External Demand Org Unit ID
        in: path
        name: extOrgUnitId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtDemandOrgUnitSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtDemandOrgUnitSchema'
          description: OK
      summary: Patch External Demand Org Unit
      tags:
      - Ext Demand Org Unit
components:
  schemas:
    DemandOrgUnitOwnerSchema:
      type: object
      properties:
        email:
          type: string
          description: Email of the owner
        name:
          type:
          - string
          - 'null'
          description: Name of the owner
      required:
      - email
    EntityTag:
      type: object
      properties:
        type:
          type: string
          enum:
          - user
          - system
          description: Type of the tag (user/system)
        name:
          type: string
          description: Name of the tag
        category:
          type:
          - string
          - 'null'
          enum:
          - inherited_tag
          - null
          description: Category of the tag (e.g. inherited_tag)
      required:
      - name
      - type
    RmUserGroup:
      type: object
      properties:
        userGroupId:
          type:
          - string
          - 'null'
          description: Unique identifier for the user group
    ExtDemandOrgUnitSchema:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - archived
          description: 'Status of the org unit. Possible values: [''active'', ''archived'']'
        updatedBy:
          type:
          - string
          - 'null'
          description: Email of the updater of the org unit
        userGroups:
          description: User groups associated with the org unit
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RmUserGroup'
        extOrgUnitId:
          type: string
          description: Org unit id in the external system
        _type:
          type: string
          enum:
          - program
          - project
          description: 'Type of the org unit. Possible values: [''program'', ''project'']'
        mainOwner:
          description: Main owner of the org unit
          allOf:
          - $ref: '#/components/schemas/DemandOrgUnitOwnerSchema'
        endDate:
          type:
          - string
          - 'null'
          description: End date of the org unit in ISO format (YYYY-MM-DD)
        createdBy:
          type: string
          description: Email of the creator of the org unit
        description:
          type:
          - string
          - 'null'
          description: Description of the org unit
        otherOwners:
          description: Other owners of the org unit
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DemandOrgUnitOwnerSchema'
        parentExtId:
          type:
          - string
          - 'null'
          description: Parent org unit id in the external system
        startDate:
          type: string
          description: Start date of the org unit in ISO format (YYYY-MM-DD)
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          description: Updated timestamp for the org unit
        customFields:
          type:
          - object
          - 'null'
          description: Custom fields for the org unit
        title:
          type: string
          description: Title of the org unit
        tags:
          description: Tags associated with the org unit
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EntityTag'
      required:
      - _type
      - createdBy
      - extOrgUnitId
      - startDate
      - status
      - title

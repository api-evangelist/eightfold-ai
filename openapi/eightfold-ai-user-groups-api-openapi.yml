openapi: 3.2.0
info:
  title: Api_server_v2_service Service User Groups API
  version: 1.0.0
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-wu
      - eightfold-ap
tags:
- name: User Groups
paths:
  /api/v2/core/user-groups:
    post:
      description: Creates a user group. userGroupName must be unique within the tenant, ignoring case and surrounding whitespace. Access criteria and dynamic membership rules cannot be set through this API. Members are assigned through the user group membership APIs.
      operationId: create_user_group
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupCreateSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupBaseSchema'
          description: OK
      summary: Create User Group
      tags:
      - User Groups
    get:
      description: Returns a list of user groups, ordered by name. Both active and inactive user groups are returned by default; the isActive field carries the state. Member counts are not returned here; use the Get User Group endpoint for those.
      operationId: list_user_group
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Set to true to return only active user groups. Omitted or false returns both active and inactive.
        in: query
        name: onlyActive
        schema:
          type: boolean
      - description: Return only user groups with this name. Matching is case-insensitive, so groups whose names differ only by case are all returned.
        in: query
        name: userGroupName
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/UserGroupBaseSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List User Groups
      tags:
      - User Groups
  /api/v2/core/user-groups/{userGroupId}:
    get:
      description: Given a user group id, it returns the user group along with its member counts. staticMemberCount is read from the database and is always current; dynamicMemberCount is read from the search index, can lag a recent change, and is null if that index cannot be reached, which is distinct from a count of zero.
      operationId: get_user_group_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of a user group in Eightfold
        in: path
        name: userGroupId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupDetailSchema'
          description: OK
      summary: Get User Group
      tags:
      - User Groups
    delete:
      description: Deletes a specific user group given a user group id. Assigned users do not block the delete; they are removed from the group along with it.
      operationId: delete_user_group
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of a user group in Eightfold
        in: path
        name: userGroupId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupBaseSchema'
          description: OK
      summary: Delete User Group
      tags:
      - User Groups
    patch:
      description: Updates a user group. Send only the fields to change; anything omitted is left untouched. Access criteria and dynamic membership rules cannot be set through this API. Renaming a group changes what the SCIM APIs report for it, since those identify a group by name.
      operationId: patch_user_group
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of a user group in Eightfold
        in: path
        name: userGroupId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupPatchSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupBaseSchema'
          description: OK
      summary: Patch User Group
      tags:
      - User Groups
  /api/v2/core/user-groups/{userGroupId}/users:
    post:
      description: 'Assigns users to a user group. Additive: users already in the group are reported back in existingUsers and left untouched, so the call is safe to retry. Every id is validated before any is written, so one bad id rejects the whole request. Candidate and deleted accounts cannot be assigned, and system user groups are refused because their membership is derived from roles.'
      operationId: create_user_group_users
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of a user group in Eightfold
        in: path
        name: userGroupId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupAssignMembersSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupMembershipResultSchema'
          description: OK
      summary: Assign User Group Members
      tags:
      - User Groups
    get:
      description: Returns the members of a user group. Assigned members are read from the database, so an assignment is visible immediately; members matched by the group's rules are read from the search index and can lag a recent change. Every member carries a membershipType, and only static members can be removed.
      operationId: list_user_group_users
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of a user group in Eightfold
        in: path
        name: userGroupId
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter to static (explicitly assigned) or dynamic (matched by the group's rules) members. Defaults to all. Use static to skip the search index query entirely.
        in: query
        name: membershipType
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/UserGroupMemberSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List User Group Members
      tags:
      - User Groups
  /api/v2/core/user-groups/{userGroupId}/users/{userId}:
    delete:
      description: 'Removes one assigned member from a user group. Members matched by the group''s rules are computed rather than stored and cannot be removed. Safe to retry: removedUsers is empty when the user was not an assigned member. System user groups are refused because their membership is derived from roles.'
      operationId: delete_user_group_users
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID of a user group in Eightfold
        in: path
        name: userGroupId
        required: true
        schema:
          type: string
      - description: ID of a user in Eightfold
        in: path
        name: userId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroupRemovalResultSchema'
          description: OK
      summary: Remove User Group Member
      tags:
      - User Groups
components:
  schemas:
    UserGroupCreateSchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Create timestamp of the user group
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user group
        isActive:
          type: boolean
          description: Whether the user group is active
        description:
          type:
          - string
          - 'null'
          description: Description of the user group
        productLine:
          type:
          - string
          - 'null'
          description: Product line this user group applies to. Defaults to all product lines
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Update timestamp of the user group
        role:
          type:
          - string
          - 'null'
          description: Role granted to the members of the user group
        userGroupName:
          type: string
          description: Name of the user group. Must be unique within the tenant, ignoring case
      required:
      - userGroupName
    UserGroupMembershipResultSchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Create timestamp of the user group
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user group
        isActive:
          type:
          - boolean
          - 'null'
          description: Whether the user group is active
        addedUsers:
          readOnly: true
          description: Users assigned to the group by this request
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserGroupMemberSchema'
        description:
          type:
          - string
          - 'null'
          description: Description of the user group
        productLine:
          type:
          - string
          - 'null'
          description: Product line this user group applies to. Defaults to all product lines
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Update timestamp of the user group
        role:
          type:
          - string
          - 'null'
          description: Role granted to the members of the user group
        userGroupName:
          type:
          - string
          - 'null'
          description: Name of the user group
        existingUsers:
          readOnly: true
          description: Users from the request that were already members, left untouched
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserGroupMemberSchema'
    UserGroupPatchSchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Create timestamp of the user group
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user group
        isActive:
          type: boolean
          description: Whether the user group is active
        description:
          type:
          - string
          - 'null'
          description: Description of the user group
        productLine:
          type:
          - string
          - 'null'
          description: Product line this user group applies to. Defaults to all product lines
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Update timestamp of the user group
        role:
          type:
          - string
          - 'null'
          description: Role granted to the members of the user group
        userGroupName:
          type:
          - string
          - 'null'
          description: Name of the user group
    UserGroupRemovalResultSchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Create timestamp of the user group
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user group
        isActive:
          type:
          - boolean
          - 'null'
          description: Whether the user group is active
        description:
          type:
          - string
          - 'null'
          description: Description of the user group
        removedUsers:
          readOnly: true
          description: Users whose assigned membership was removed by this request. Empty when nobody was removed, which is how a retried call reports that the member had already gone
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserGroupMemberSchema'
        productLine:
          type:
          - string
          - 'null'
          description: Product line this user group applies to. Defaults to all product lines
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Update timestamp of the user group
        role:
          type:
          - string
          - 'null'
          description: Role granted to the members of the user group
        userGroupName:
          type:
          - string
          - 'null'
          description: Name of the user group
    UserGroupAssignMembersSchema:
      type: object
      properties:
        userIds:
          type: array
          writeOnly: true
          description: Ids of the users to assign, at most 100 per request. Every id is validated before any is written, so one bad id rejects the whole request
          items:
            type: integer
            format: int32
      required:
      - userIds
    UserGroupBaseSchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Create timestamp of the user group
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user group
        isActive:
          type:
          - boolean
          - 'null'
          description: Whether the user group is active
        description:
          type:
          - string
          - 'null'
          description: Description of the user group
        productLine:
          type:
          - string
          - 'null'
          description: Product line this user group applies to. Defaults to all product lines
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Update timestamp of the user group
        role:
          type:
          - string
          - 'null'
          description: Role granted to the members of the user group
        userGroupName:
          type:
          - string
          - 'null'
          description: Name of the user group
    UserGroupDetailSchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Create timestamp of the user group
        id:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user group
        staticMemberCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Number of users explicitly assigned to the user group
        isActive:
          type:
          - boolean
          - 'null'
          description: Whether the user group is active
        dynamicMemberCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Number of users matching the dynamic membership rules of the user group. Null if the search index could not be reached, which is distinct from a count of zero
        description:
          type:
          - string
          - 'null'
          description: Description of the user group
        productLine:
          type:
          - string
          - 'null'
          description: Product line this user group applies to. Defaults to all product lines
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Update timestamp of the user group
        role:
          type:
          - string
          - 'null'
          description: Role granted to the members of the user group
        userGroupName:
          type:
          - string
          - 'null'
          description: Name of the user group
    MetaSchema:
      type: object
      properties:
        totalCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
        pageTotalCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
        pageStartIndex:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
    UserGroupMemberSchema:
      type: object
      properties:
        uuid:
          type:
          - string
          - 'null'
          readOnly: true
          description: External unique identifier of the user
        userId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Id of the user
        membershipType:
          type:
          - string
          - 'null'
          readOnly: true
          description: static for an explicitly assigned member, dynamic for one matched by the group rules. Only static members can be removed
        firstName:
          type:
          - string
          - 'null'
          readOnly: true
          description: First name of the user
        lastName:
          type:
          - string
          - 'null'
          readOnly: true
          description: Last name of the user
        email:
          type:
          - string
          - 'null'
          readOnly: true
          description: Email of the user

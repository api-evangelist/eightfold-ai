          - string
          - 'null'
          description: ProfileId of User
        defaultAccessMode:
          type: string
          description: Access Mode of User
        isDisabled:
          type:
          - boolean
          - 'null'
          description: Email of User
        atsData:
          description: Ats Data of an User
          allOf:
          - $ref: '#/components/schemas/UserAtsData'
        firstName:
          type:
          - string
          - 'null'
          description: First Name of User
        company:
          type:
          - string
          - 'null'
          description: company of User
        hrbpData:

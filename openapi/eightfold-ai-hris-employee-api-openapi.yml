        phone:
          type:
          - string
          - 'null'
          readOnly: true
          description: The phone number of the employee
        performanceRatings:
          readOnly: true
          description: The performance rating of the employee
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmployeePerformanceRating'
        languages:
          readOnly: true
          description: The employee language proficiencies
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmployeeLanguageProficiency'
        title:
          type:
          - string
          - 'null'
          readOnly: true
          description: The title of the employee
        id:
          type:
          - string
          - 'null'
          readOnly: true
          description: The unique id of the Employee in the HRIS system
        terminationDate:
          type:
          - string
          - 'null'
          readOnly: true
          description: The termination date of the employee
        hiringDate:
          type:
          - string
          - 'null'
          readOnly: true
          description: The hiring date of the employee
        managerUserId:
          type:
          - string
          - 'null'
          readOnly: true
          description: The user id of the manager in HRIS system
        successionPlan:
          readOnly: true
          description: The succession plan of the employee
          allOf:
          - $ref: '#/components/schemas/EmployeeSuccessionPlan'
        bonus:
          readOnly: true
          description: The bonus given to the employee
          allOf:
          - $ref: '#/components/schemas/Pay'
        lastActivityTs:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: The last activity timestamp
        managerFullname:
          type:
          - string
          - 'null'
          readOnly: true
          description: The full name of the manager
        jobCode:
          type:
          - string
          - 'null'
          readOnly: true
          description: The job code of the employee
        tenureCurrentRoleYears:
          type:
          - number
          - 'null'
          format: float
          readOnly: true
          description: The no of years the employee is in current role
        basePayFrequency:
          type:
          - string
          - 'null'
          readOnly: true
          description: The frequency of the base pay of the employee
        lob:
          type:
          - string
          - 'null'
          readOnly: true
          description: The lob of the employee
        roleChangeDate:
          type:
          - string
          - 'null'
          readOnly: true
          description: The last role change date of the employee
        role:
          type:
          - string
          - 'null'
          readOnly: true
          description: The role of the employee
        eligibleForTransfer:
          type:
          - boolean
          - 'null'
          readOnly: true

        travelPercentageMin:
          type:
          - number
          - 'null'
          format: float
          description: The min travel percentage
        relocationLocations:
          type:
          - array
          - 'null'
          description: The relocation locations
          items:
            type: string
        relocation:
          type:
          - string
          - 'null'
          description: The relocation information
        travel:
          type:
          - string
          - 'null'
          description: The travel detail
        travelPercentageMax:
          type:
          - number
          - 'null'
          format: float
          description: The max travel percentage
    EmployeeBadge:
      type: object
      properties:
        badgeId:
          type:
          - string
          - 'null'
          description: The id of the badge
        userId:
          type:
          - string
          - 'null'
          description: The user id the badge belongs to.
        creator:
          type:
          - string
          - 'null'
          description: The creator of the badge
        photoUrl:
          type:
          - string
          - 'null'
          description: The photo url
        lastModifiedTs:
          type:
          - integer
          - 'null'
          format: int32
          description: The last modified timestamp of the badge
        photoContent:
          description: The photo content
          allOf:
          - $ref: '#/components/schemas/PhotoContent'
        comment:
          type:
          - string
          - 'null'
          description: comment on the badge
        title:
          type:
          - string
          - 'null'
          description: The title of the badge
    User:
      type: object
      properties:
        atsUserGroups:
          description: The user groups
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserGroup'
        name:
          type:
          - string
          - 'null'

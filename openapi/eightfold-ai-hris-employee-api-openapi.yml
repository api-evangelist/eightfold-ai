          - string
          - 'null'
          description: The speaking proficiency
        overall:
          type:
          - string
          - 'null'
          description: The overall proficiency
        language:
          type:
          - string
          - 'null'
          description: The language string
        write:
          type:
          - string
          - 'null'
          description: The writing proficiency
    EmployeeSuccessionPlan:
      type: object
      properties:
        comments:
          type:
          - string
          - 'null'

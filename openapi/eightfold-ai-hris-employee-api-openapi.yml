          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmployeeSuccessor'
    PhotoContent:
      type: object
      properties:
        extension:
          type:
          - string
          - 'null'
          readOnly: true
          description: The extension of the photo
        content:
          type:
          - string
          - 'null'
          readOnly: true
          description: The actual string content
        isBase64:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Is the content base 64 encoded
    EmployeePerformanceRating:
      type: object
      properties:
        periodEndDate:
          type:
          - string
          - 'null'
          description: The performance period end date
        rating:
          type:
          - number
          - 'null'
          format: float
          description: The rating given
        reviewedBy:
          description: The reviewer info
          allOf:
          - $ref: '#/components/schemas/User'
        ratingLabel:
          type:
          - string
          - 'null'

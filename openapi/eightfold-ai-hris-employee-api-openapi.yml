openapi: 3.2.0
info:
  title: Api_server_v2_service Service HRIS Employee API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: HRIS Employee
paths:
  /api/v2/core/hris-systems/{systemId}/hris-employees/{uniqueIdentifier}:
    get:
      description: Given an email id or employee id of an employee, it returns the HRIS employee information
      operationId: get_HRIS_employee_hris_employees_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: HRIS system ID. Use default if you have only one system and dont want to use system-Id.
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Employee Email ID or unique Id
        in: path
        name: uniqueIdentifier
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HRISEmployeeSchema'
          description: OK
      summary: Get HRIS Employee
      tags:
      - HRIS Employee
  /api/v2/core/hris-systems/{systemId}/hris-employees:
    get:
      description: List call that returns all the employee profiles.
      operationId: list_HRIS_employee_hris_employees
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: HRIS system ID. Use default if you have only one system and dont want to use system-Id.
        in: path
        name: systemId
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Filter query using predefined filter arguments documented [here](https://apidocs.eightfold.ai/v2.0/docs#the-filterquery-parameter)
        in: query
        name: filterQuery
        schema:
          type: string
      - description: Any wildcard text to search in position
        in: query
        name: query
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HRISEmployeeSchema'
          description: OK
      summary: List HRIS Employees
      tags:
      - HRIS Employee
components:
  schemas:
    UserGroup:
      type: object
      properties:
        userGroupId:
          type:
          - string
          - 'null'
          format: email
          description: ''
    EmployeeSuccessor:
      type: object
      properties:
        employeeDetails:
          description: The employee details
          allOf:
          - $ref: '#/components/schemas/User'
        readiness:
          type:
          - string
          - 'null'
          description: The readiness of the successor
        rank:
          type:
          - integer
          - 'null'
          format: int32
          description: The rank
        comments:
          type:
          - string
          - 'null'
          description: The comments
    AdditionalManager:
      type: object
      properties:
        capacityManagerEmail:
          type:
          - string
          - 'null'
          readOnly: true
          description: The email of the capacity manager
        employeeId:
          type:
          - string
          - 'null'
          description: Employee id of the additional manager in the HRIS system
        type:
          type:
          - string
          - 'null'
          description: Type of the additional manager (e.g. capacity)
        email:
          type:
          - string
          - 'null'
          description: Email of the additional manager
    Pay:
      type: object
      properties:
        frequency:
          type:
          - string
          - 'null'
          description: The frequency of pay
        amount:
          type:
          - number
          - 'null'
          format: float
          description: The amount of pay
        currency:
          type:
          - string
          - 'null'
          description: The currency of pay in ISO format
    HRISEmployeeSchema:
      type: object
      properties:
        locationCountry:
          type:
          - string
          - 'null'
          readOnly: true
          description: The location country of the employee
        bonusAmount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: The amount of the bonus of the employee
        managerEmail:
          type:
          - string
          - 'null'
          readOnly: true
          description: The email of the manager
        positionCriticality:
          type:
          - array
          - 'null'
          readOnly: true
          description: The criticality of the position of the employee
          items:
            type: string
        bonusAmountCurrency:
          type:
          - string
          - 'null'
          readOnly: true
          description: The currency of the bonus given to the employee
        location:
          type:
          - string
          - 'null'
          readOnly: true
          description: The location of the employee
        badges:
          readOnly: true
          description: The badges of the employee
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmployeeBadge'
        firstName:
          type:
          - string
          - 'null'
          readOnly: true
          description: First Name of employee
        mobility:
          readOnly: true
          description: The mobility of the employee
          allOf:
          - $ref: '#/components/schemas/EmployeeMobility'
        bu:
          type:
          - string
          - 'null'
          readOnly: true
          description: The Business unit of the employee
        email:
          type:
          - string
          - 'null'
          readOnly: true
          description: List of Emails of the employee comma seperated
        bonusAmountFrequency:
          type:
          - string
          - 'null'
          readOnly: true
          description: The frequency of the bonus pay to the employee
        basePayCurrency:
          type:
          - string
          - 'null'
          readOnly: true
          description: The currency of the base pay of the employee
        basePay:
          readOnly: true
          description: The base pay of the employee
          allOf:
          - $ref: '#/components/schemas/Pay'
        level:
          type:
          - string
          - 'null'
          readOnly: true
          description: The job level of the employee
        userId:
          type:
          - string
          - 'null'
          readOnly: true
          description: The userId of the employee
        lastReviewRating:
          type:
          - string
          - 'null'
          readOnly: true
          description: The last review rating of the employee
        additionalManagers:
          readOnly: true
          description: The additional managers of the employee
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalManager'
        customInfo:
          type:
          - object
          - 'null'
          readOnly: true
          description: The custom info captured for the employee by custom fields
        tenureYears:
          type:
          - number
          - 'null'
          format: float
          readOnly: true
          description: The total tenure years of the employee
        systemId:
          type:
          - string
          - 'null'
          readOnly: true
          description: The system id of the HRIS system in EF
        employeeCriticality:
          readOnly: true
          description: The criticality information of the employee
          allOf:
          - $ref: '#/components/schemas/EmployeeCriticality'
        companyName:
          type:
          - string
          - 'null'
          readOnly: true

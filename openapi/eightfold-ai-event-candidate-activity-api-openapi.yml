openapi: 3.2.0
info:
  title: Api_server_v2_service Service Event Candidate Activity API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: Event Candidate Activity
paths:
  /api/v2/events/event-candidate-activities/{eventActivityId}:
    get:
      description: Given an event activity id of a candidate, it returns all attributes of the event activity
      operationId: get_event_candidate_activity_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: event activity ID of event candidate activity in Eightfold
        in: path
        name: eventActivityId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCandidateActivitySchema'
          description: OK
      summary: Get Event Candidate Activity
      tags:
      - Event Candidate Activity
  /api/v2/events/event-candidate-activities/batch-fetch:
    post:
      description: Batch fetch event candidate activity for a given list of entity ids (limit 100)
      operationId: event_candidate_activity_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/EventCandidateActivitySchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Event Candidate Activities
      tags:
      - Event Candidate Activity
  /api/v2/events/event-candidate-activities:
    get:
      description: Search event candidate activities using specific filter parameters and get all attributes of the entities
      operationId: list_event_candidate_activity
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Limit on the total number of search results, defaults to 100
        in: query
        name: queryLimit
        schema:
          type: string
      - description: Filter on planned event id for the event acitivities
        in: query
        name: plannedEventId
        schema:
          type: string
      - description: Filter on profile id of the candidate
        in: query
        name: profileId
        schema:
          type: string
      - description: Filter on position id associated with the event activity
        in: query
        name: positionId
        schema:
          type: string
      - description: Filter on type of activity
        in: query
        name: activityType
        schema:
          type: string
      - description: Filter on subkey id of the event activity
        in: query
        name: subkeyId
        schema:
          type: string
      - description: Filter on user id who created the event
        in: query
        name: createdBy
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/EventCandidateActivitySchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Event Candidate Activities
      tags:
      - Event Candidate Activity
components:
  schemas:
    BatchFetchEntityRequestSchema:
      type: object
      properties:
        entityIds:
          type: array
          description: list of entity ids to fetch the entity objects
          items:
            type: string
      required:
      - entityIds
    MetaSchema:
      type: object
      properties:
        totalCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
        pageTotalCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
        pageStartIndex:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
    EventCandidateActivitySchema:
      type: object
      properties:
        createdAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Timestamp when this event activity was created
        plannedEventId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Planned event id associated with the event activity
        updatedBy:
          type:
          - string
          - 'null'
          readOnly: true
          description: User id which updated this event activity
        subkeyId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Subkey id for the event activity
        activityResult:
          type:
          - string
          - 'null'
          readOnly: true
          description: Activity result for this event activity
        dataJson:
          type:
          - object
          - 'null'
          readOnly: true
          description: Data json for the event candidate activity
        profileId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Profile Id for the candidate
        activityType:
          type:
          - string
          - 'null'
          readOnly: true
          description: Activity type for this event activity
        id:
          type:
          - string
          - 'null'
          readOnly: true
          description: Event Candidate Activity Id
        updatedAt:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Timestamp when this event activity was updated
        createdBy:
          type:
          - string
          - 'null'
          readOnly: true
          description: User id which created this event activity
        rsvpResponse:
          type:
          - string
          - 'null'
          readOnly: true
          description: RSVP response by the candidate
        positionId:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: Position Id for the position associated to the event for some specific activity types
    BatchFetchMetaSchema:
      type: object
      properties:
        missingEntityIds:
          type:
          - array
          - 'null'
          readOnly: true
          description: List of entity ids for which no result was found
          items:
            type: string

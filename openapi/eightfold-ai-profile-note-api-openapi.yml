openapi: 3.2.0
info:
  title: Api_server_v2_service Service Profile Note API
  version: 1.0.0
  x-source-url: https://dash.readme.com/api/v1/api-registry/1c8ed7dqdmruc4aua
  x-documentation-url: https://apidocs.eightfold.ai/docs/getting-started
  x-last-validated: '2026-08-10'
  x-provenance: first-party — retrieved from the provider's own documentation host
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: Profile Note
paths:
  /api/v2/core/profile-notes/{profileNoteId}:
    get:
      description: Given a profile note id of a candidate, it returns all attributes of the profile note
      operationId: get_profile_note_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: profile note ID of note in Eightfold
        in: path
        name: profileNoteId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: OK
      summary: Get Profile Note
      tags:
      - Profile Note
  /api/v2/core/profile-notes/batch-fetch:
    post:
      description: Batch fetch profile notes for a given list of note ids (limit 100)
      operationId: profile_note_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Note'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch Profile Notes
      tags:
      - Profile Note
  /api/v2/core/profile-notes:
    get:
      description: Search profile notes using specific filter parameters and get the complete profile note objects
      operationId: list_profile_note
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Limit on the total number of search results, defaults to 100
        in: query
        name: queryLimit
        schema:
          type: string
      - description: Creator user id to filter on
        in: query
        name: creatorEmail
        schema:
          type: string
      - description: profile id to filter on
        in: query
        name: profileId
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Note'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List Profile Notes
      tags:
      - Profile Note
    post:
      description: Create a profile note for a candidate. profileId is required. noteType must be one of note, email, other, title_note — email is intended for internal integrations or callers from allowed domains only, as email notes appear in sourcing analytics and recruiter dashboards. positionId is optional.
      operationId: create_profile_note
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreateRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: OK
      summary: Create Profile Note
      tags:
      - Profile Note
components:
  schemas:
    BatchFetchMetaSchema:
      type: object
      properties:
        missingEntityIds:
          type:
          - array
          - 'null'
          readOnly: true
          description: List of entity ids for which no result was found
          items:
            type: string
    BatchFetchEntityRequestSchema:
      type: object
      properties:
        entityIds:
          type: array
          description: list of entity ids to fetch the entity objects
          items:
            type: string
      required:
      - entityIds
    Note:
      type: object
      properties:
        creatorEmail:
          type:
          - string
          - 'null'
          description: creator email of candidate
        id:
          type:
          - string
          - 'null'
          readOnly: true
          description: Note id of candidate
        noteType:
          type:
          - string
          - 'null'
          description: Note type of candidate
        note:
          type:
          - string
          - 'null'
          description: Note of candidate
        profileId:
          type:
          - string
          - 'null'
          readOnly: true
          description: Profile id of candidate
        positionId:
          type:
          - string
          - 'null'
          description: Position id associated with the note
        createdTime:
          type:
          - integer
          - 'null'
          format: int32
          description: created time of candidate in datetime format
    MetaSchema:
      type: object
      properties:
        totalCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
        pageTotalCount:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
        pageStartIndex:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
          description: ''
    NoteCreateRequestSchema:
      type: object
      properties:
        profileId:
          type: string
          description: Profile id of candidate
        positionId:
          type:
          - string
          - 'null'
          description: Position id associated with the note
        noteType:
          type:
          - string
          - 'null'
          enum:
          - note
          - email
          - other
          description: 'Note type of candidate. Valid values: note, email, other. Note: email is intended for internal integrations or callers from allowed domains only — email notes appear in sourcing analytics and recruiter dashboards.'
        note:
          type:
          - string
          - 'null'
          description: Note of candidate
      required:
      - profileId

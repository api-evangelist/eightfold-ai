openapi: 3.2.0
info:
  title: Api_server_v2_service Service User Message API
  version: 1.0.0
servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-wu
      - eightfold-ap
tags:
- name: User Message
paths:
  /api/v2/core/user-messages:
    get:
      description: Search user messages using specific filter parameters and get all attributes of entities
      operationId: list_user_message
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Limit on the total number of search results, defaults to 100
        in: query
        name: queryLimit
        schema:
          type: string
      - description: Filter on user id of the message
        in: query
        name: userId
        schema:
          type: string
      - description: Filter on profile id of the candidate
        in: query
        name: profileId
        schema:
          type: string
      - description: Filter on position id associated with the message
        in: query
        name: positionId
        schema:
          type: string
      - description: Filter on conversation id of the message
        in: query
        name: conversationId
        schema:
          type: string
      - description: Filter on email address to which email message was addressed
        in: query
        name: emailTo
        schema:
          type: string
      - description: Filter on email address from which email message was sent
        in: query
        name: emailFrom
        schema:
          type: string
      - description: Filter on campaign id of the user message
        in: query
        name: userCampaignId
        schema:
          type: string
      - description: Filter on template id of the user message
        in: query
        name: templateId
        schema:
          type: string
      - description: Filter on create timestamp of user message
        in: query
        name: createdAt
        schema:
          type: string
      - description: Filter on reply time of user message
        in: query
        name: replyTime
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are emailContent, messageContent
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/UserMessageSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List User Messages
      tags:
      - User Message
  /api/v2/core/user-messages/batch-fetch:
    post:
      description: Batch fetch user messages for a given list of user message ids (limit 100)
      operationId: user_message_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are emailContent, messageContent
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/UserMessageSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch User Messages
      tags:
      - User Message
  /api/v2/core/user-messages/{userMessageId}:
    get:
      description: Given a user message id, it returns all attributes of the user message
      operationId: get_user_message_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Id of user message in Eightfold
        in: path
        name: userMessageId
        required: true
        schema:
          type: string
      - description: Include additional fields in the response. Possible values are emailContent, messageContent
        in: query
        name: include
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMessageSchema'
          description: OK
      summary: Get User Message
      tags:
      - User Message

servers:
- url: https://apiv2.{domain}.ai
  variables:
    domain:
      default: eightfold
      enum:
      - eightfold
      - eightfold-eu
      - eightfold-gov
      - eightfold-ca
      - eightfold-me
      - eightfold-wu
      - eightfold-ap
tags:
- name: User Calendar Event
paths:
  /api/v2/core/user-calendar-events/{userCalendarEventId}:
    get:
      description: Given the id of User Calendar Event, it returns all attributes of the entity
      operationId: get_user_calendar_event_by_id
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Entity Id of User Calendar Event in Eightfold
        in: path
        name: userCalendarEventId
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCalendarEventDetailSchema'
          description: OK
      summary: Get User Calendar Event
      tags:
      - User Calendar Event
  /api/v2/core/user-calendar-events/batch-fetch:
    post:
      description: Batch fetch user calendar events for a given list of entity ids (limit 100)
      operationId: user_calendar_event_batch_fetch
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFetchEntityRequestSchema'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/UserCalendarEventsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/BatchFetchMetaSchema'
                type: object
          description: OK
      summary: Batch Fetch User Calendar Events
      tags:
      - User Calendar Event
  /api/v2/core/user-calendar-events:
    get:
      description: Search User Calendar Events using specific filter parameters and get all attributes of the entity objects
      operationId: list_user_calendar_event
      parameters:
      - description: The secret key to access the api. It starts with the bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Specifies the offset value to start for the page
        in: query
        name: start
        schema:
          type: integer
      - description: Specifies the number of entries to be returned for the page
        in: query
        name: limit
        schema:
          type: integer
      - description: Limit on the total number of search results, defaults to 100
        in: query
        name: queryLimit
        schema:
          type: string
      - description: Filter on User id who created the calendar event
        in: query
        name: creatorUserId
        schema:
          type: string
      - description: Filter on position id associated with the calendar event
        in: query
        name: positionId
        schema:
          type: string
      - description: Filter on profile id of the candidate
        in: query
        name: profileId
        schema:
          type: string
      - description: Filter on candidate's email address
        in: query
        name: candidateEmail
        schema:
          type: string
      - description: Filter on meeting time of the calendar event
        in: query
        name: meetingTime
        schema:
          type: string
      - description: Filter on assignee user id of the calendar event
        in: query
        name: assigneeUserId
        schema:
          type: string
      - description: Filter on the status of the calendar event
        in: query
        name: status
        schema:
          type: string
      - description: Filter on the event type (e.g. INTERVIEW); case-insensitive.
        in: query
        name: eventType
        schema:
          type: string
      - description: Comma-separated list of user calendar event ids to filter by (e.g. 1,2,3).
        in: query
        name: entityIds
        schema:
          type: string
      - description: Exclude specific fields in the response. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: exclude
        schema:
          type: string
      - description: Allows selective control over the fields returned in the API response. If the keyList is empty, all fields will be returned. Possible values are the names of the top level fields present in corresponding API schema. To check API schema, expand the response section below.
        in: query
        name: keyList
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/UserCalendarEventsSchema'
                    type: array
                  meta:
                    $ref: '#/components/schemas/MetaSchema'
                type: object
          description: OK
      summary: List User Calendar Events
      tags:
      - User Calendar Event

name: Eightfold AI
url: https://raw.githubusercontent.com/api-evangelist/eightfold-ai/refs/heads/main/apis.yml
description: Eightfold AI is an agentic Talent Intelligence Platform that combines enterprise HR data
  with insights from more than a billion career profiles to power talent acquisition, talent management,
  workforce planning, internal mobility, resource management, and AI-driven interviewing. The platform
  is delivered as enterprise SaaS with sales-led onboarding; APIs and ATS/HRIS integrations are exposed
  to customers and certified partners (e.g. Oracle Fusion Cloud Recruiting) under contract rather than
  via a public, self-serve developer portal.
